basic:
  icon: "🧮"
  category: 생활 계산기
  heading: 기본·공학용 계산기
  intro: 사칙연산과 퍼센트 계산부터 괄호가 포함된 수식, 삼각함수와 로그까지 브라우저에서 계산합니다. 계산하려는 식을 입력한 뒤 단위와 각도 설정을 확인하고 결과를 살펴보세요.
  features:
    - 사칙연산, 괄호와 퍼센트가 포함된 기본 수식을 계산합니다.
    - 삼각함수와 역삼각함수, 로그, 제곱근 등 공학용 함수를 지원합니다.
    - 도 단위와 라디안 단위 설정을 확인해 각도 계산을 맞출 수 있습니다.
  steps:
    - 기본 계산기에서 식을 입력합니다. 계산 순서를 바꾸려면 괄호를 사용합니다.
    - 삼각함수를 사용할 때는 각도가 도인지 라디안인지 먼저 확인합니다.
    - 계산을 실행하고 결과를 확인합니다. 입력한 수식에 오류가 있으면 괄호와 연산자를 점검합니다.
  notice: 수식 결과를 참고용으로 확인하고, 세금·계약·안전처럼 중요한 결정에는 원자료와 계산 조건을 별도로 검토하세요.
  faqs:
    - question: 괄호가 있는 식도 계산할 수 있나요?
      answer: 기본 계산기에 수식을 입력해 괄호와 연산 순서를 반영할 수 있습니다. 계산할 수 없는 문자가 있거나 괄호가 맞지 않으면 식을 고쳐 다시 계산하세요.
    - question: 삼각함수 결과가 예상과 다른 이유는 무엇인가요?
      answer: 각도 단위가 도 또는 라디안 중 무엇으로 설정되어 있는지 확인하세요. 같은 숫자도 각도 단위에 따라 결과가 달라집니다.

date:
  icon: "📅"
  category: 생활 계산기
  heading: 날짜·디데이 계산기
  intro: 두 날짜 사이의 간격을 확인하거나 기준 날짜에 기간을 더하고 빼며, 양력과 음력 날짜를 함께 살펴볼 수 있습니다. 기념일, 일정 준비와 마감일을 계산할 때 날짜 기준을 입력해 확인하세요.
  features:
    - 시작일과 종료일을 입력해 날짜 간격을 확인합니다.
    - 기준 날짜에 일수를 더하거나 빼 목표 날짜를 찾습니다.
    - 양력·음력 날짜 변환을 지원합니다.
  steps:
    - 날짜 차이, 날짜 더하기·빼기 또는 양력·음력 변환 중 원하는 기능을 선택합니다.
    - 입력 날짜와 더하거나 뺄 기간을 확인한 뒤 계산합니다.
    - 결과를 일정표에 옮기기 전에 시작일 포함 여부와 시간대 기준을 확인합니다.
  notice: 날짜 간격은 시작일을 계산에 포함하는지에 따라 하루 차이가 날 수 있습니다. 계약·신고·예약 마감일은 해당 기관이 정한 산정 규칙을 따르세요.
  faqs:
    - question: 두 날짜 사이의 며칠을 계산하나요?
      answer: 입력한 시작일과 종료일 사이의 날짜 간격을 계산합니다. 특정 기간의 마지막 날을 포함하는지 여부가 중요한 경우 결과에 하루를 더해야 하는지 해당 일정 규칙을 확인하세요.
    - question: 음력 날짜가 매년 같은 양력 날짜인가요?
      answer: 음력 날짜는 양력 달력에서 매년 같은 날짜에 해당하지 않습니다. 날짜를 변환한 뒤 해당 연도와 윤달 여부를 확인하세요.

estate:
  icon: "🏠"
  category: 금융 계산기
  heading: 부동산 세금·비용 계산기
  intro: 부동산 거래와 보유에 따라 달라지는 취득세, 양도 관련 세금, 보유세, 중개보수와 등기 비용을 조건별로 살펴봅니다. 가격만 입력하기 전에 주택 수, 보유 기간과 지역 등 계산 조건을 함께 확인하세요.
  features:
    - 취득·양도·보유 상황에 필요한 입력 항목을 구분해 계산합니다.
    - 매매와 임대 등 거래 유형에 따른 중개보수 기준을 비교합니다.
    - 입력 조건과 계산기 반영 기준에 따라 비용 항목을 추정합니다.
  steps:
    - 부동산 가격과 거래 유형, 주택 수 등 해당 계산에 필요한 조건을 입력합니다.
    - 결과에 포함된 세금과 비용 항목을 각각 확인합니다.
    - 기준일과 적용 조건을 확인하고 공식 세무·법령 자료와 대조합니다.
  notice: 부동산 세금과 비용은 보유 주택 수, 취득·양도 시점, 지역, 공제 요건과 개별 사실관계에 따라 달라집니다. 계산 결과는 신고액이나 세무 자문을 대신하지 않으므로 공식 기관 또는 전문가에게 최종 확인하세요.
  faqs:
    - question: 계산된 세액이 실제 신고액과 같나요?
      answer: 실제 세액은 법령 기준일, 보유·거주 기간, 주택 수, 공제와 개별 사정에 따라 달라질 수 있습니다. 계산 결과는 입력한 조건의 추정치로 보고 공식 신고 기준을 확인하세요.
    - question: 중개보수는 매매와 임대가 같은가요?
      answer: 거래 유형과 금액 구간에 따라 적용 기준과 상한이 다를 수 있습니다. 거래 종류와 금액을 정확히 선택하고 관할 지역의 최신 기준을 확인하세요.

hotel:
  icon: "🏨"
  category: 여행 계산기
  heading: 호텔 포인트 가치 계산기
  intro: 호텔 포인트를 구입하거나 숙박에 사용할 때 현금 요금과 비교할 수 있도록 다섯 개 브랜드의 포인트 가치와 숙박 조건을 살펴봅니다. 같은 날짜와 객실 조건을 입력해 포인트 사용이 적절한지 비교하세요.
  features:
    - 다섯 개 호텔 브랜드의 포인트 가치 비교를 지원합니다.
    - 포인트 매입 비용과 포인트 숙박 가치를 비교합니다.
    - 현금 요금, 포인트 차감량과 숙박 조건을 함께 검토합니다.
  steps:
    - 호텔 브랜드와 숙박 날짜, 객실 및 포인트 조건을 확인합니다.
    - 같은 일정의 현금 요금과 필요한 포인트를 비교합니다.
    - 세금·수수료와 취소 조건을 반영해 결과를 판단합니다.
  notice: 포인트 가치는 숙박일, 객실 재고, 현금 요금과 멤버십 규정에 따라 달라집니다. 계산은 예약 가능 여부나 향후 포인트 가치를 보장하지 않으며, 최종 조건은 호텔 공식 채널에서 확인하세요.
  faqs:
    - question: 호텔 포인트 1개의 가치는 항상 같은가요?
      answer: 아닙니다. 날짜별 현금 요금과 필요한 포인트가 달라지므로 포인트의 비교 가치는 숙박 조건마다 달라집니다.
    - question: 포인트 숙박이 현금 예약보다 항상 유리한가요?
      answer: 포인트 사용량뿐 아니라 세금, 수수료, 취소 조건과 포인트를 확보하는 비용도 함께 비교해야 합니다. 입력한 같은 일정과 객실 조건을 기준으로 판단하세요.

miles:
  icon: "✈️"
  category: 여행 계산기
  heading: 대한항공 마일리지 가치 계산기
  intro: 유상 항공권 가격과 보너스 항공권에 필요한 마일리지를 비교해 사용 조건별 마일리지 가치를 가늠합니다. 노선, 좌석 등급과 세금·유류할증료를 함께 고려해 비교하세요.
  features:
    - 유상 항공권 가격과 보너스 발권 마일리지를 비교합니다.
    - 좌석 등급과 여정 조건에 따른 마일리지 가치를 계산합니다.
    - 비교 결과를 바탕으로 현금 구매와 마일리지 사용을 검토합니다.
  steps:
    - 같은 노선·날짜·좌석 등급의 현금 요금과 보너스 발권 조건을 준비합니다.
    - 항공권 가격, 필요한 마일리지와 현금 부담액을 입력합니다.
    - 결과를 비교하고 보너스 좌석 잔여 여부와 변경·취소 조건을 공식 채널에서 확인합니다.
  notice: 항공권 가격, 세금과 보너스 좌석은 시점에 따라 달라집니다. 계산 결과는 좌석 확보나 발권 가능성을 보장하지 않으므로 실제 예약 전 대한항공 공식 채널을 확인하세요.
  faqs:
    - question: 마일리지 가치는 노선마다 달라지나요?
      answer: 현금 항공권 가격, 필요한 마일리지, 세금과 좌석 등급이 다르므로 비교 가치는 노선과 일정마다 달라집니다.
    - question: 계산 결과가 실제 보너스 좌석을 보장하나요?
      answer: 아닙니다. 좌석 재고와 발권 조건은 변동될 수 있으므로 대한항공 공식 예약 화면에서 최종 확인해야 합니다.

time:
  icon: "⏱️"
  category: 생활 계산기
  heading: 시간 계산기
  intro: 여러 구간의 시간을 더하고, 세계 주요 지역의 현재 시간을 확인하거나 스톱워치를 이용할 수 있습니다. 근무 시간, 여행 일정과 운동 시간을 간편하게 정리하세요.
  features:
    - 여러 시간 값을 합산해 총 소요 시간을 계산합니다.
    - 세계 시간 정보를 참고해 지역 간 시차를 살펴봅니다.
    - 스톱워치로 경과 시간을 측정합니다.
  steps:
    - 시간 합산, 세계시간 또는 스톱워치 기능을 선택합니다.
    - 시간·분 단위 입력을 확인하고 필요한 경우 측정을 시작합니다.
    - 결과를 일정이나 기록에 옮기기 전에 기준 시간대와 날짜 변경을 확인합니다.
  notice: 세계 시간은 지역별 시간대와 일광 절약 시간제 적용에 따라 달라질 수 있습니다. 항공편과 공식 일정은 해당 기관이 제공하는 현지 시각을 기준으로 확인하세요.
  faqs:
    - question: 여러 시간 구간을 합산할 수 있나요?
      answer: 시간 계산기에서 구간별 시간 값을 입력해 합산할 수 있습니다. 입력 단위가 시간과 분에 맞는지 확인하세요.
    - question: 세계 시간은 어떤 시간대를 기준으로 하나요?
      answer: 도시 또는 지역별 시간대 기준으로 표시됩니다. 업무나 이동 일정을 확정할 때는 해당 도시의 공식 현지 시각을 확인하세요.

age:
  icon: "🎂"
  category: 생활 계산기
  heading: 나이 계산기
  intro: 생년월일과 기준일을 바탕으로 만 나이, 연 나이와 세는 나이를 확인합니다. 서류 작성이나 일정 확인에서 어떤 나이 기준을 요구하는지 먼저 살펴보세요.
  features:
    - 생년월일과 기준 날짜를 이용해 만 나이를 계산합니다.
    - 연 나이와 세는 나이를 함께 비교합니다.
    - 기준일을 바꾸어 특정 날짜의 나이를 확인합니다.
  steps:
    - 생년월일과 계산 기준일을 입력합니다.
    - 확인할 나이 기준을 선택하거나 결과 항목을 비교합니다.
    - 신청서·자격 요건에서 요구하는 기준과 결과를 대조합니다.
  notice: 기관별 자격이나 법률 적용은 나이 계산 방식과 기준일을 별도로 정할 수 있습니다. 공적 신청과 계약에는 해당 기관의 기준을 따르세요.
  faqs:
    - question: 만 나이와 연 나이는 어떻게 다른가요?
      answer: 만 나이는 생일이 지났는지를 기준으로 계산하고, 연 나이는 기준 연도와 출생 연도의 차이를 사용합니다. 세는 나이와도 계산 방식이 다릅니다.
    - question: 신청 자격 나이는 계산기 결과를 그대로 쓰면 되나요?
      answer: 자격마다 기준일과 연령 계산 방식이 정해져 있을 수 있습니다. 신청 공고나 담당 기관의 안내를 기준으로 확인하세요.

unit:
  icon: "📏"
  category: 생활 계산기
  heading: 단위 변환 계산기
  intro: 면적, 길이, 무게, 부피, 온도와 용량 단위를 필요한 기준으로 바꿉니다. 상품 비교와 공간 측정에 사용할 값을 입력하고 원래 단위와 결과 단위를 확인하세요.
  features:
    - 평과 제곱미터 등 면적 단위를 변환합니다.
    - 길이·무게·부피·온도·용량 단위를 지원합니다.
    - 입력 단위와 변환할 단위를 직접 선택할 수 있습니다.
  steps:
    - 변환 종류와 입력 단위를 선택합니다.
    - 수치를 입력하고 변환 결과의 단위를 확인합니다.
    - 필요에 따라 표시 자릿수를 조정해 비교합니다.
  notice: 단위 변환은 수학적 환산을 제공하며 측정 오차, 제품 표시 규정이나 부동산 계약상 면적 기준을 판정하지 않습니다. 공식 문서의 단위를 우선 확인하세요.
  faqs:
    - question: 면적을 평과 제곱미터 사이에서 바꿀 수 있나요?
      answer: 면적 단위 변환에서 입력 단위와 출력 단위를 선택해 환산할 수 있습니다. 부동산 공식 면적 표기는 계약서와 공적 자료를 기준으로 확인하세요.
    - question: 온도 단위도 변환할 수 있나요?
      answer: 단위 변환기에서 온도를 선택하고 입력·출력 단위를 지정해 계산할 수 있습니다.

fx:
  icon: "💱"
  category: 금융 계산기
  heading: 환율 계산기
  intro: 지원 통화 간 금액을 환산하고 조회 기준일과 수수료를 함께 확인합니다. 실제 카드 결제나 송금 금액은 금융기관의 적용 환율과 수수료에 따라 달라질 수 있습니다.
  features:
    - 출발·도착 통화를 선택해 금액을 환산합니다.
    - 조회된 환율의 기준일을 확인합니다.
    - 입력한 수수료 조건을 반영해 예상 금액을 비교합니다.
  steps:
    - 환전 방향과 두 통화 코드를 선택합니다.
    - 금액과 계산에 포함할 수수료 조건을 입력합니다.
    - 환율 기준일과 결과를 확인하고 거래 전 금융기관 고시를 대조합니다.
  notice: 표시 환율은 실제 거래 환율과 다를 수 있습니다. 금융기관·카드사별 우대율, 수수료와 적용 시점은 별도로 확인하세요. 환율 조회 요청에는 통화 코드만 외부 API로 전송되며 계산값은 브라우저에서 처리됩니다.
  faqs:
    - question: 계산 결과가 실제 결제 금액과 일치하나요?
      answer: 실제 금액에는 금융기관별 환율, 환전 수수료, 카드 해외 이용 수수료와 적용 시점이 반영될 수 있어 계산 결과와 다를 수 있습니다.
    - question: 환율은 언제 기준인가요?
      answer: 계산기 결과에 표시된 조회 기준일을 확인하세요. 환율은 변동되므로 송금이나 결제 직전에 거래 기관의 적용 환율을 확인해야 합니다.

interest:
  icon: "💵"
  category: 금융 계산기
  heading: 예금·적금·대출 이자 계산기
  intro: 예금과 적금의 예상 이자, 대출 이자와 상환 흐름을 조건별로 비교합니다. 원금, 금리, 기간과 납입 시점을 확인해 서로 같은 조건으로 계산하세요.
  features:
    - 예금과 적금의 납입 방식에 따른 이자를 비교합니다.
    - 대출 상환 방식과 기간을 바꾸어 납입액을 살펴봅니다.
    - 금리와 기간을 조정해 조건별 결과를 비교합니다.
  steps:
    - 예금·적금 또는 대출 계산 유형을 선택합니다.
    - 원금, 연이율, 기간, 납입 주기와 상환 방식을 입력합니다.
    - 세전·세후 구분과 납입 시점을 확인하고 결과를 비교합니다.
  notice: 실제 이자와 상환액은 금융기관의 금리 산정, 우대 조건, 세금, 수수료와 상환 일정에 따라 달라집니다. 대출 계약과 예금 상품의 공식 설명서를 최종 기준으로 삼으세요.
  faqs:
    - question: 적금 이자는 어떤 조건에 따라 달라지나요?
      answer: 월 납입액, 납입 횟수, 연이율, 납입 시점과 이자 계산 방식에 따라 달라집니다. 상품의 세전·세후 조건도 함께 확인하세요.
    - question: 대출 상환액은 실제 청구액과 같나요?
      answer: 계산은 입력 조건에 따른 추정치입니다. 실제 상환 일정에는 약정 금리, 상환일, 수수료와 금융기관의 계약 조건이 반영됩니다.

salary:
  icon: "💰"
  category: 금융 계산기
  heading: 급여·퇴직·실업급여 계산기
  intro: 급여 실수령액과 시급·주휴수당, 퇴직금·퇴직연금 및 실업급여를 상황별로 계산합니다. 근로 형태, 급여 기준 기간, 근속 기간과 적용 연도를 정확히 선택하세요.
  features:
    - 월급·연봉 조건에 따른 공제와 예상 실수령액을 확인합니다.
    - 시급과 근로시간에 따른 주급·주휴수당을 살펴봅니다.
    - 퇴직급여와 실업급여의 입력 조건별 추정치를 확인합니다.
  steps:
    - 급여, 시급, 퇴직 또는 실업급여 중 필요한 계산 유형을 선택합니다.
    - 급여·근로시간·근속기간 등 해당 항목의 입력값과 기준연도를 확인합니다.
    - 결과를 급여명세서, 고용보험 안내와 비교해 최종 금액을 확인합니다.
  notice: 급여 공제와 고용보험 급여 기준은 법령·보험료율·개인별 근로 이력에 따라 달라집니다. 계산 결과는 참고용이며 실제 급여, 퇴직급여 또는 수급 자격은 회사·고용노동부·근로복지공단 등 공식 자료로 확인하세요.
  faqs:
    - question: 실수령액은 세금과 보험료를 모두 반영하나요?
      answer: 선택한 급여 유형과 입력 조건에 따라 계산기에 포함된 공제 항목이 반영됩니다. 실제 급여명세에는 개인별 공제와 회사 규정이 적용될 수 있습니다.
    - question: 계산 결과로 실업급여 수급 자격을 알 수 있나요?
      answer: 계산 결과는 입력 조건에 따른 추정 정보입니다. 실제 수급 자격은 고용보험 가입 기간과 이직 사유 등 공식 심사를 통해 결정됩니다.

health:
  icon: "💪"
  category: 건강 계산기
  heading: 건강·체중 계산기
  intro: 키와 체중 등을 입력해 BMI, 적정 체중 범위, 체지방 추정치, 에너지 필요량과 일부 건강 지표를 계산합니다. 개인의 건강 상태를 진단하지 않으며 결과는 일반적인 참고 정보입니다.
  features:
    - 키와 체중을 이용해 BMI와 참고 체중 범위를 계산합니다.
    - 체지방·기초대사량과 일일 에너지 추정 항목을 확인합니다.
    - 허리둘레와 목표 체중, 운동 심박수 관련 지표를 살펴봅니다.
  steps:
    - 원하는 건강 계산 항목을 선택하고 필요한 신체 정보를 입력합니다.
    - 단위와 연령·성별 등 계산 조건이 맞는지 확인합니다.
    - 결과를 일반 참고 지표로 읽고 개인 건강 판단은 의료 전문가와 상의합니다.
  notice: BMI와 에너지 추정식은 개인의 체성분, 질환, 임신, 약물 복용과 운동 상태를 모두 반영하지 않습니다. 진단이나 식이·운동 처방에 사용하지 말고 건강상 우려가 있으면 의료진과 상담하세요.
  faqs:
    - question: BMI만으로 건강 상태를 알 수 있나요?
      answer: BMI는 키와 체중을 이용한 일반 지표이며 체성분과 개인 건강 상태를 모두 설명하지 않습니다. 의료적 판단을 대신하지 않습니다.
    - question: 계산한 칼로리가 개인의 정확한 필요량인가요?
      answer: 계산값은 선택한 입력과 추정식에 따른 참고치입니다. 실제 에너지 필요량은 활동량과 건강 상태에 따라 달라질 수 있습니다.
