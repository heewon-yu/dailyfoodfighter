map_food:
  service: "한입지도"
  eyebrow: "유튜브 맛집 검색"
  heading: "유튜브 맛집 지도"
  intro: "먹방·미식 영상에 나온 국내 맛집을 가게 이름, 지역, 메뉴와 소개 채널로 찾아보고 원본 영상과 지도 위치를 함께 확인하세요."
  action_label: "한입지도에서 맛집 찾기"
  action_url: "/map/?view=food"
  points:
    - title: "지역과 메뉴로 탐색"
      text: "서울·부산·제주 등 지역과 국밥·고기·디저트 같은 메뉴를 조합해 후보를 좁힐 수 있습니다."
    - title: "원본 영상 확인"
      text: "누가 소개했는지와 영상의 해당 장면을 확인한 뒤 방문 후보를 비교할 수 있습니다."
    - title: "지도에서 최종 확인"
      text: "동명이점이나 이전 가능성이 있으므로 방문 전 지도에서 주소와 영업시간을 다시 확인합니다."
  steps:
    - "한입지도에서 지역이나 메뉴를 검색합니다."
    - "장소 카드에서 소개 채널과 영상 장면을 확인합니다."
    - "지도 링크로 최신 주소와 영업시간을 확인합니다."
  faqs:
    - question: "유튜브 영상에 나온 모든 맛집이 있나요?"
      answer: "공개 영상에서 장소를 확인할 수 있는 항목을 중심으로 정리하므로 모든 영상과 모든 식당을 포함하지는 않습니다."
    - question: "예약이나 영업시간도 확인할 수 있나요?"
      answer: "서비스는 장소 탐색을 돕습니다. 예약 가능 여부와 최신 영업시간은 연결된 지도나 식당 공식 채널에서 확인해야 합니다."
    - question: "같은 식당의 영상이 여러 개면 어떻게 표시하나요?"
      answer: "중복 장소는 대표 영상 중심으로 정리해 같은 식당이 반복 노출되지 않도록 합니다."
  related:
    - label: "유튜브 숙소 지도"
      url: "/map/stays/"
    - label: "해외 호텔·미쉐린 지도"
      url: "/map/overseas/"

map_stays:
  service: "한밤지도"
  eyebrow: "유튜브 숙소 검색"
  heading: "유튜브 숙소 지도"
  intro: "여행 영상과 숙소 리뷰에 나온 국내 호텔·리조트·펜션을 지역과 숙소명으로 찾고, 소개 영상과 지도 위치를 함께 비교하세요."
  action_label: "한밤지도에서 숙소 찾기"
  action_url: "/map/?view=stay"
  points:
    - title: "영상 속 숙소를 한곳에서"
      text: "여행·숙박 콘텐츠에서 확인한 숙소를 지역별로 모아 이름을 몰라도 후보를 탐색할 수 있습니다."
    - title: "소개 장면과 위치 비교"
      text: "영상의 분위기와 지도 위치를 함께 확인해 이동 동선과 여행 목적에 맞는지 판단할 수 있습니다."
    - title: "예약 전 최신 정보 확인"
      text: "객실명·요금·운영 상태는 달라질 수 있으므로 최종 예약은 숙소 공식 페이지에서 확인합니다."
  steps:
    - "한밤지도 탭에서 여행 지역 또는 숙소명을 검색합니다."
    - "장소 카드에서 숙소 유형과 원본 영상을 확인합니다."
    - "지도와 공식 예약 채널에서 최신 조건을 확인합니다."
  faqs:
    - question: "숙박 요금도 제공하나요?"
      answer: "영상과 위치 기반의 숙소 탐색 서비스이며 날짜별 실시간 숙박 요금은 제공하지 않습니다."
    - question: "호텔 외 펜션이나 리조트도 찾을 수 있나요?"
      answer: "공개 영상에서 장소가 확인된 경우 호텔뿐 아니라 리조트와 펜션 등도 포함될 수 있습니다."
    - question: "영상 정보가 현재와 다르면 어떻게 하나요?"
      answer: "게시 이후 상호·운영 상태가 달라질 수 있으므로 방문 전 지도와 공식 채널의 최신 정보를 확인해야 합니다."
  related:
    - label: "유튜브 맛집 지도"
      url: "/map/restaurants/"
    - label: "힐튼 포인트 숙박 조회"
      url: "/hotel/points-stay/"

map_overseas:
  service: "해외지도"
  eyebrow: "해외 미식·호텔 검색"
  heading: "해외 호텔·미쉐린 레스토랑 지도"
  intro: "여행 영상에 소개된 해외 호텔과 미쉐린 레스토랑을 국가·도시·장소 유형으로 찾고, 원본 영상과 지도 위치를 확인하세요."
  action_label: "해외지도에서 장소 찾기"
  action_url: "/map/?view=abroad"
  points:
    - title: "도시별 여행 후보 탐색"
      text: "여행지를 정한 뒤 호텔과 레스토랑을 한 화면에서 비교해 일정 후보를 만들 수 있습니다."
    - title: "미쉐린 등재 정보 구분"
      text: "장소 카드의 유형과 소개 출처를 확인해 일반 맛집과 미쉐린 등재 레스토랑을 구분합니다."
    - title: "영상과 지도 교차 확인"
      text: "소개 장면으로 분위기를 보고 지도에서 실제 위치와 이동 동선을 확인합니다."
  steps:
    - "해외지도 탭에서 국가·도시 또는 장소명을 검색합니다."
    - "호텔·레스토랑 유형과 원본 영상을 비교합니다."
    - "지도와 공식 채널에서 예약·운영 정보를 최종 확인합니다."
  faqs:
    - question: "미쉐린 등급은 실시간으로 갱신되나요?"
      answer: "등재 상태는 변경될 수 있으므로 방문할 연도의 미쉐린 가이드 공식 페이지에서 최종 확인해야 합니다."
    - question: "해외 호텔 예약도 할 수 있나요?"
      answer: "장소 탐색과 비교를 위한 서비스이며 예약은 호텔 또는 예약 플랫폼의 공식 화면에서 진행합니다."
    - question: "원본 영상으로 바로 이동할 수 있나요?"
      answer: "장소 카드에서 수록 근거가 된 공개 영상과 해당 소개 장면을 확인할 수 있습니다."
  related:
    - label: "유튜브 맛집 지도"
      url: "/map/restaurants/"
    - label: "대한항공 보너스 좌석"
      url: "/air/"

hotel_points:
  service: "힐튼포숙지도"
  eyebrow: "Hilton Honors 포인트 숙박"
  heading: "힐튼 포인트 숙박 호텔 조회"
  intro: "월도프 아스토리아·콘래드·LXR 호텔의 관측 포인트와 현금가를 비교하고, 같은 날짜 조건에서 힐튼 Honors 1포인트 가치를 계산하세요."
  action_label: "힐튼 포인트 숙박 조회"
  action_url: "/hotel/#points"
  points:
    - title: "도시별 하이엔드 호텔 비교"
      text: "도시와 날짜를 고른 뒤 세 브랜드의 포인트 숙박 후보를 한 화면에서 비교합니다."
    - title: "1포인트 가치 계산"
      text: "세금 포함 현금가를 필요한 포인트로 나눠 원/P를 계산하면 현금과 포인트 중 유리한 쪽을 판단하기 쉽습니다."
    - title: "공식 예약 화면으로 확인"
      text: "관측 값은 특정 날짜의 실시간 재고가 아니므로 선택한 날짜의 Standard 또는 Premium 보상 객실을 공식 화면에서 확인합니다."
  steps:
    - "도시, 체크인·체크아웃 날짜와 인원을 선택합니다."
    - "후보 호텔의 관측 포인트와 공식 날짜 조회를 확인합니다."
    - "세금 포함 현금가를 입력해 1포인트 가치를 비교합니다."
  faqs:
    - question: "표시된 포인트로 바로 예약할 수 있나요?"
      answer: "표시 값은 브랜드 디렉터리에서 관측한 향후 기간의 참고값입니다. 실제 날짜의 재고와 필요 포인트는 힐튼 공식 예약 화면에서 확인해야 합니다."
    - question: "Standard Room Reward와 Premium Room Reward는 무엇이 다른가요?"
      answer: "Standard는 호텔이 정한 표준 객실 보상이고 Premium은 상위 객실 또는 변동 포인트 객실입니다. 숙박권은 일반적으로 Standard 가능 여부를 확인해야 합니다."
    - question: "1포인트 가치는 어떻게 계산하나요?"
      answer: "같은 날짜와 객실 조건의 세금 포함 현금가에서 포인트 결제 추가비용을 뺀 뒤 필요한 포인트로 나눕니다."
  related:
    - label: "힐튼 주말숙박권 가능 호텔"
      url: "/hotel/weekend-reward/"
    - label: "호텔 포인트 가치 계산기"
      url: "/cal/hotel/"

hotel_weekend:
  service: "힐튼포숙지도"
  eyebrow: "Free Night Reward"
  heading: "힐튼 주말숙박권 사용 가능 호텔"
  intro: "금·토·일 숙박 기준으로 Standard Room Reward가 관측된 월도프 아스토리아·콘래드·LXR 호텔을 찾고 공식 예약 화면에서 최종 확인하세요."
  action_label: "주말숙박권 호텔 조회"
  action_url: "/hotel/#weekend"
  points:
    - title: "Standard 객실 여부 확인"
      text: "포인트 숫자만 보지 않고 Standard Room Reward인지 확인해야 숙박권 사용 가능성을 판단할 수 있습니다."
    - title: "금·토·일 날짜 점검"
      text: "국내 제휴카드의 주말숙박권 조건을 기준으로 체크인 요일과 카드사별 제한을 함께 확인합니다."
    - title: "제외 호텔과 추가비용 확인"
      text: "올인클루시브 등 제외 유형과 리조트피·도시세처럼 숙박권에 포함되지 않을 수 있는 비용을 확인합니다."
  steps:
    - "주말숙박권 탭에서 도시와 금·토·일 날짜를 선택합니다."
    - "Standard Room Reward로 분류된 후보를 확인합니다."
    - "카드사 약관과 힐튼 공식 예약 화면에서 사용 가능 여부를 확정합니다."
  faqs:
    - question: "힐튼 주말숙박권은 평일에도 쓸 수 있나요?"
      answer: "힐튼 글로벌 제도와 국내 제휴카드 조건이 다를 수 있습니다. 이 서비스는 국내 제휴카드의 금·토·일 조건을 기준으로 안내하므로 보유 카드의 최신 약관을 확인해야 합니다."
    - question: "Premium Room Reward에도 숙박권을 쓸 수 있나요?"
      answer: "일반적으로 숙박권은 Standard Room Reward 객실을 기준으로 하며 Premium만 열려 있다면 사용하기 어렵습니다."
    - question: "표시된 호텔은 숙박권 사용이 보장되나요?"
      answer: "아닙니다. 관측 시점의 분류를 제공하며 실제 날짜의 재고와 카드별 제한은 공식 채널에서 최종 확인해야 합니다."
  related:
    - label: "힐튼 포인트 숙박 조회"
      url: "/hotel/points-stay/"
    - label: "힐튼 호텔 전체 디렉터리"
      url: "/hotel/#directory"

macro_fear_greed:
  service: "경제지표지도"
  eyebrow: "시장 심리"
  heading: "미국 공포·탐욕지수와 VIX 한눈에"
  intro: "미국 증시 공포·탐욕지수와 VIX를 같은 화면에서 확인하고, 수치가 가리키는 시장 심리를 금리·신용 지표와 함께 비교하세요."
  action_label: "오늘의 시장 심리 확인"
  action_url: "/macro/#g-sentiment"
  points:
    - title: "공포·탐욕 점수"
      text: "0에 가까울수록 공포, 100에 가까울수록 탐욕으로 보는 시장 심리 요약값입니다."
    - title: "VIX 변동성"
      text: "옵션시장이 예상하는 단기 변동성 수준을 함께 보면 심리 점수와 시장 긴장의 방향을 비교할 수 있습니다."
    - title: "단일 지표로 판단하지 않기"
      text: "금리·신용 스프레드·주가지수 흐름을 함께 확인하고 투자 판단을 대신하는 신호로 사용하지 않습니다."
  steps:
    - "공포·탐욕지수의 현재 점수와 구간을 확인합니다."
    - "VIX와 전일 변화 방향을 비교합니다."
    - "금리·신용·시장 지표를 함께 보고 맥락을 확인합니다."
  faqs:
    - question: "공포·탐욕지수가 낮으면 매수 신호인가요?"
      answer: "아닙니다. 시장 심리를 요약한 참고 지표이며 가격의 바닥이나 향후 수익률을 보장하지 않습니다."
    - question: "VIX와 공포·탐욕지수는 같은 지표인가요?"
      answer: "VIX는 옵션시장의 예상 변동성이고 공포·탐욕지수는 여러 시장 자료를 조합한 심리 지표라 계산 방식과 의미가 다릅니다."
    - question: "수치는 얼마나 자주 갱신되나요?"
      answer: "경제지표지도는 제공 가능한 최신 시세와 공식 통계를 주기적으로 갱신하며 각 카드의 기준 시점을 함께 표시합니다."
  related:
    - label: "금리·CPI·PPI 확인"
      url: "/macro/rates-inflation/"
    - label: "경제지표지도 전체"
      url: "/macro/"

macro_rates:
  service: "경제지표지도"
  eyebrow: "금리·물가"
  heading: "미국 금리·장단기 금리차·CPI 확인"
  intro: "미국 10년물·2년물 국채금리와 장단기 금리차, 하이일드 스프레드, CPI·PPI 발표치와 예상치를 한 화면에서 비교하세요."
  action_label: "금리·물가 지표 확인"
  action_url: "/macro/#g-rates"
  points:
    - title: "10년물과 2년물 금리"
      text: "장기 성장·물가 기대와 단기 통화정책 기대가 금리곡선에 어떻게 반영되는지 비교합니다."
    - title: "장단기 금리차"
      text: "10년물에서 2년물을 뺀 값을 보고 금리곡선의 정상·역전 상태를 확인합니다."
    - title: "CPI·PPI 예상 대비 실제"
      text: "발표 수치만 보지 않고 시장 예상과의 차이를 함께 확인해 반응의 배경을 살펴봅니다."
  steps:
    - "10년물·2년물 금리와 장단기 금리차를 확인합니다."
    - "하이일드 스프레드로 신용시장 긴장을 비교합니다."
    - "CPI·PPI의 예상치와 실제 발표치를 함께 봅니다."
  faqs:
    - question: "장단기 금리차 역전은 경기침체를 확정하나요?"
      answer: "역전은 경기 둔화 우려를 볼 때 자주 참고하는 신호지만 시점과 결과를 확정하지는 않으므로 다른 지표와 함께 봐야 합니다."
    - question: "CPI가 예상보다 높으면 주가는 반드시 하락하나요?"
      answer: "시장 반응은 이전 가격 반영, 세부 항목, 금리 기대와 함께 결정되므로 한 발표만으로 방향을 단정할 수 없습니다."
    - question: "이 정보는 투자 권유인가요?"
      answer: "아닙니다. 공개 지표를 비교하기 위한 참고 자료이며 투자 판단과 손익에 대한 책임을 대신하지 않습니다."
