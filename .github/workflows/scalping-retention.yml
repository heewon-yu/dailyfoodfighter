name: Scalping King D1 retention
on:
  schedule:
    # 01:20 KST, on the default branch only after the rollout is approved.
    - cron: '20 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    # Fail closed: no calls until production DB migration, secret, and validation are completed.
    if: vars.SCALPING_RETENTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate maintenance token and call production retention
        env:
          TOKEN: ${{ secrets.SCALPING_D1_MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "${TOKEN:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::SCALPING_D1_MAINTENANCE_TOKEN is missing or malformed"
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 20 --retry 2 \
            -X POST "https://dailyfoodfighter.com/api/scalping/retention" \
            -H "Authorization: Bearer ${TOKEN}")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          payload = json.loads(os.environ["RESPONSE"])
          if payload.get("ok") is not True:
              raise SystemExit("Retention endpoint did not confirm success")
          print("Scalping retention succeeded", payload.get("day"))
          PY
