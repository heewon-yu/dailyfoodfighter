name: Scalping King v2 tests
on:
  push:
    branches:
      - main
      - feature/scalping-king-v2-foundation
      - codex/scalping-king-integration-20261112
    paths:
      - 'games/scalping-king/**'
      - 'supabase/**'
      - '.github/workflows/scalping-v2-tests.yml'
  pull_request:
    paths:
      - 'games/scalping-king/**'
      - 'supabase/**'
      - '.github/workflows/scalping-v2-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Risk and accounting
        run: node games/scalping-king/risk-v2.test.cjs
      - name: Persistent order book and VI
        run: node games/scalping-king/microstructure-v2.test.cjs
      - name: Integrated market and reward lifecycle
        run: node games/scalping-king/integration-v2.test.cjs
      - name: Install Chromium for browser tests
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.65.0 @electric-sql/pglite@0.5.16
          npx playwright-core install --with-deps chromium
      - name: Server result, signed callback and PostgreSQL isolation
        run: node games/scalping-king/official-v2.test.cjs
      - name: Desktop and mobile touch smoke tests
        run: node games/scalping-king/browser-v2.test.cjs
