<article class="post-article">
  <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; color: #111827;">푸드파이터 문의 창구</h1>
  
  <div class="post-content">
    <p>푸드파이터 블로그를 방문해 주셔서 감사합니다. 포스팅 내용에 대한 학술적 피드백, 정보 정정 요청, 콘텐츠 제휴 등은 아래 온라인 양식을 통해 접수해 주시기 바랍니다.</p>

    <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; margin: 24px 0;">
      <form onsubmit="event.preventDefault(); alert('소중한 의견이 안전하게 접수되었습니다. 검토 후 신속히 반영하겠습니다.'); this.reset();">
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem;">성함 또는 닉네임</label>
          <input type="text" required placeholder="홍길동" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem;">답변 받으실 이메일 (선택)</label>
          <input type="email" placeholder="example@email.com" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem;">문의 유형</label>
          <select style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; background: #fff;">
            <option>영양학 콘텐츠 정보 정정 및 제안</option>
            <option>제휴 및 협업 문의</option>
            <option>기타 의견 및 피드백</option>
          </select>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem;">문의 내용</label>
          <textarea required rows="5" placeholder="문의하실 내용을 자유롭게 작성해 주세요." style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; line-height: 1.6;"></textarea>
        </div>

        <button type="submit" style="background: #10b981; color: #fff; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 700; border-radius: 6px; cursor: pointer; transition: background 0.15s;">문의 제출하기</button>
      </form>
    </div>

    <p style="font-size: 0.85rem; color: #6b7280;">접수된 모든 문의는 블로그 운영팀에서 안전하게 확인하며, 스팸 및 불필요한 홍보성 메시지는 사전 고지 없이 삭제될 수 있습니다.</p>
  </div>
</article>
