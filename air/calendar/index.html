<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>월별 달력 | 마일지도 대한항공 보너스 좌석</title>
<meta name="description" content="대한항공 국제선 보너스 좌석을 날짜별 달력에서 E·R·P·F 등급으로 확인합니다.">
<meta name="theme-color" content="#0f2340">
<link rel="stylesheet" href="/air/assets/milemap-app.css?v=3">
<script src="/air/assets/app.js" defer></script>
<script src="/air/assets/view-calendar.js" defer></script>
</head>
<body data-air-page="calendar">
<main id="air-main" class="air-main">

  <div class="air-page-head">
    <p class="air-hero__eyebrow" style="color:#2563eb">Month view</p>
    <h1>월별 달력</h1>
    <p>한 달 좌석 표식을 달력으로 보고, 날짜별 E·R·P·F를 확인하세요.</p>
  </div>

  <div class="air-notice air-notice--info" role="note">
    <span class="air-notice__icon" aria-hidden="true">ℹ</span>
    <div>
      날짜 칸의 <strong>E·R·P·F</strong> 글자는 그 등급의 좌석 표시가 있었음을 뜻합니다.
      회색 '없음'은 조회 결과 좌석 표시가 없었던 날, 점선 '미조회'는 데이터가 없는 날입니다.
    </div>
  </div>

  <div id="air-calendar-view"></div>

</main>
</body>
</html>
