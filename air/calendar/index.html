<main id="air-main" class="air-main">

  <div class="air-page-head">
    <p class="air-hero__eyebrow" style="color:#2563eb">Calendar &amp; map</p>
    <h1>달력/지도</h1>
    <p>지도에서 노선을 고르면 아래 달력이 그 노선으로 바로 바뀝니다. 날짜별 프레스티지·일등석 좌석과 성수기를 한눈에 확인하세요.</p>

  <div class="air-notice air-notice--info" role="note">
    <span class="air-notice__icon" aria-hidden="true">ℹ</span>
    <div>
      날짜 칸의 <strong>P·F</strong> 글자는 그 등급의 좌석 표시가 있었음을 뜻합니다.
      회색 '없음'은 조회 결과 예약 가능한 좌석 표시가 없었던 날이고, 아무 표시도 없는 날은
      그날의 조회 기록이 없는 날입니다. <strong>성수기</strong> 표시가 있는 날은 공제 마일이 더 높습니다.
    </div>
  </div>

  <div id="air-calendar-view"></div>
