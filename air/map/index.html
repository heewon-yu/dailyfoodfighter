<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>달력/지도 | 마일지도 대한항공 보너스 좌석</title>
<meta name="description" content="지도 탭은 달력/지도 페이지로 통합되었습니다. 지도에서 노선을 고르고 날짜별 좌석을 확인하세요.">
<meta name="theme-color" content="#0f2340">
<link rel="canonical" href="https://dailyfoodfighter.com/air/calendar/">
<meta http-equiv="refresh" content="0;url=/air/calendar/">
<script>
/* 기존 /air/map/ 주소로 들어온 사용자를 달력/지도로 보낸다. 검색 조건(쿼리)은 그대로 넘긴다. */
(function () {
  try {
    location.replace("/air/calendar/" + location.search);
  } catch (error) {
    /* 자바스크립트가 막혀 있으면 meta refresh 와 아래 안내 링크로 이동한다. */
  }
})();
</script>
</head>
<body>
<p>지도 탭은 <a href="/air/calendar/">달력/지도</a>로 통합되었습니다. 자동으로 이동하지 않으면 링크를 눌러 주세요.</p>
</body>
</html>
