---
layout: default
---

<article class="post-article">
  <header class="post-header">
    <div class="post-meta">
      <span class="post-category">🏷️ {{ page.category | default: page.categories | first }}</span>
      <span class="post-date">📅 {{ page.date | date: "%Y년 %m월 %d일" }}</span>
      <span class="post-author">✍️ 영양전문 에디터</span>
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <div class="post-tags">
      {% for tag in page.tags %}
      <span class="tag">#{{ tag }}</span>
      {% endfor %}
    </div>
    <div class="post-nav-share">
      <a href="{{ '/' | relative_url }}" class="btn-back">← 목록으로 돌아가기</a>
    </div>
  </footer>
</article>
