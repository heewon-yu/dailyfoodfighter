function representativePlaces(entries) {
  const byBranch = new Map();
  for (const [name,region,area,kind,menu,id,label,start,grade] of entries) {
    const size = subscribers[label];
    // Michelin-guide entries are curated by the guide itself, so a small channel review is kept too.
    if (!Number.isFinite(size) || (size < 100000 && !grade)) continue;
    const key = [name,region].map(value=>value.normalize('NFKC').toLowerCase().replace(/\s+/g,'')).join('|');
    const entry = {name,region,area,kind,menu,source:{id,label,subscribers:size},start,grade:grade || ''};
    const existing = byBranch.get(key);
    if (!existing) {
      byBranch.set(key,{...entry,reviews:[]});
      continue;
    }
    if (size > existing.source.subscribers ||
        (size === existing.source.subscribers && existing.start === null && start !== null)) {
      existing.reviews.unshift({menu:existing.menu,source:existing.source,start:existing.start});
      Object.assign(existing,entry);
    } else {
      existing.reviews.push({menu:entry.menu,source:entry.source,start:entry.start});
    }
    if (!existing.grade && grade) existing.grade = grade;
  }
  return [...byBranch.values()];
}
