<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111722"><title>300초 · 300 SECONDS</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1019;color:#e8e7e1;font:16px/1.55 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px 18px 40px}header{display:flex;justify-content:space-between;align-items:center;color:#d4b57c;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(56px,14vw,88px);line-height:1;margin:26px 0 8px;letter-spacing:-.07em;color:#e6c58e}h2{font-size:22px;margin:8px 0}p{margin:8px 0 16px}.panel{background:#161f2d;border:1px solid #344255;border-radius:18px;padding:20px;margin:16px 0}.hero{height:170px;border-radius:14px;background:radial-gradient(ellipse at 50% 28%,#665130 0%,#252a34 35%,#111722 75%);display:grid;place-items:center;overflow:hidden}.clock{width:108px;height:108px;border:3px solid #c7a46c;border-radius:100%;position:relative;box-shadow:0 0 50px #d4b57c33}.clock:before,.clock:after{content:'';position:absolute;left:50%;top:50%;width:3px;height:39px;background:#d4b57c;transform-origin:top;transform:rotate(145deg)}.clock:after{height:28px;transform:rotate(248deg)}button{width:100%;padding:13px 15px;margin:5px 0;border-radius:10px;border:1px solid #435168;background:#222e40;color:#f1eee5;font:inherit;cursor:pointer;text-align:left;min-height:48px}button.primary{background:#d4b57c;color:#111722;font-weight:750;text-align:center;border-color:#d4b57c}select{width:100%;background:#222e40;color:#f1eee5;border:1px solid #435168;border-radius:10px;padding:13px;margin:8px 0;font:inherit}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid #e6c58e;outline-offset:3px}.muted{font-size:13px;color:#a6b2c1}.gold{color:#d4b57c}.center{text-align:center}#timer{font-size:48px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2;color:#e6c58e}progress{width:100%;height:6px;accent-color:#d4b57c}#feedback{min-height:26px;color:#e0c58b}#clues button{color:#e6c58e}#clues p{margin:4px 0 12px;padding:10px 12px;background:#1c2938;border-radius:8px}.wrong{border-color:#bb6666!important}.stats{display:flex;justify-content:space-between;color:#aeb9c8;font-size:13px}.danger{color:#ff9595!important}[hidden]{display:none!important}#question{white-space:pre-line;font-size:17px;line-height:1.8}.topbtn{width:auto;margin:0;padding:8px 12px;min-height:38px;font-size:12px}footer{margin-top:24px;color:#8290a3;font-size:12px;text-align:center}</style><main><header><span>300 SECONDS / MYSTERY</span><button class="topbtn" id="sound" aria-pressed="false">소리 OFF</button></header><section id="home"><div class="panel center"><div class="hero"><div class="clock" aria-hidden="true"></div></div><p class="gold muted">MYSTERY SURVIVAL</p><h1>300초</h1><p class="gold">3 0 0 &nbsp; S E C O N D S</p><h2>세 개의 단서, 하나의 진실.</h2><p class="muted">시간이 끝나기 전에 사건을 해결하라.</p><button class="primary" id="start">추리 시작</button><button id="daily">오늘의 사건</button><label class="muted" for="categoryFilter">카테고리별 도전</label><select id="categoryFilter"><option value="all">전체 카테고리 · 무작위</option></select><button id="categoryStart">선택한 카테고리 시작</button><p class="muted" id="record"></p></div></section><section id="game" hidden><div class="stats"><span id="case"></span><span id="score"></span></div><div class="center" id="timer" role="timer" aria-label="남은 시간">05:00</div><progress id="bar" max="300" value="300"></progress><article class="panel"><div class="gold muted" id="category"></div><h2 id="title"></h2><p id="question"></p><div id="clues"></div></article><div id="options"></div><p id="feedback" role="status"></p><button id="next" class="primary" hidden>다음 사건</button><button id="quit">게임 종료</button></section><section id="result" hidden class="panel center"><p class="gold">CASE CLOSED</p><h2 id="resultTitle"></h2><p id="resultStats"></p><p id="resultExplanation"></p><button class="primary" id="again">다시 도전</button><button id="back">메인으로</button></section><footer>베타 · 32개 검수 중인 추리 초안 · 오늘의 사건은 브라우저당 1회 · 공용 랭킹 미연결</footer></main><script>const BANK = [{"id":"C002","category":"일상 미스터리","title":"빈 우편함","question":"매일 아침 우편함을 확인하는 여자는 오늘 우편함이 비어 있는 것을 보고 기뻐했다. 배달원은 정상적으로 왔고 편지를 기다린 것도 아니다. 우편함에는 발송할 우편물을 넣는 별도 표시가 있다. 왜 기뻤을까?","answer":"자신이 넣은 발송 우편물이 수거돼서","hints":["받는 우편만 생각하지 말자.","우편함의 발송 표시가 중요하다.","배달원이 가져간 것이 있다."],"explanation":"발송용 우편물을 정상 수거했다는 뜻이다.","options":["자신이 넣은 발송 우편물이 수거돼서","편지가 도난당해서","배달원이 결근해서","우편함이 새것이라서"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"outgoing-mail"},{"id":"C003","category":"범인 찾기","title":"보이지 않는 잉크","question":"전시품을 만지면 손에만 형광 가루가 묻는다. 사건 직후 네 용의자의 손을 검사했다. 민수는 옷에만, 지수는 손에, 서준은 신발에만, 유나는 어디에도 가루가 없다. 장갑 사용과 가루 전이는 없었다. 누가 만졌는가?","answer":"지수","hints":["가루가 묻은 위치를 보자.","옷과 신발은 직접 접촉의 증거가 아니다.","손에 가루가 있는 사람은 한 명이다."],"explanation":"조건상 손의 형광 가루가 직접 접촉 증거다.","options":["지수","민수","서준","유나"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"contact-trace"},{"id":"C004","category":"알리바이·거짓말","title":"세 진술","question":"A는 B가 가져갔다고, B는 자신이 가져가지 않았다고, C는 A가 가져갔다고 말했다. 세 사람 중 범인은 한 명이며 정확히 두 진술이 참이다. 범인은?","answer":"A","hints":["A와 B의 말은 서로 반대다.","두 진술 중 하나만 참이다.","C의 말이 반드시 참이어야 한다."],"explanation":"A와 B 중 참은 하나이므로 C가 참이어야 두 개가 된다.","options":["A","B","C","판단 불가"],"source":"original draft / classic reasoning where applicable","difficulty":"초급","mechanism":"complementary-statements"},{"id":"C005","category":"밀실·불가능","title":"잠긴 전시실","question":"자동 잠금 전시실 안의 종이 작품이 젖었다. 문은 열리지 않았고 천장·벽 누수도 없다. 작품 바로 위에 놓였던 얼음 조각은 사라졌고 받침대에 물이 있다. 원인은?","answer":"얼음이 녹아 작품 위로 흘렀다","hints":["누군가 들어올 필요는 없다.","얼음 조각의 상태가 변했다.","받침대의 물은 녹은 얼음이다."],"explanation":"실내에 있던 얼음이 녹아 물이 흘렀다.","options":["얼음이 녹아 작품 위로 흘렀다","문을 몰래 열었다","작품 자체가 물을 만들었다","천장에서 비가 샜다"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"ice-melt"},{"id":"C006","category":"논리·수리","title":"세 개의 상자","question":"사과만, 배만, 혼합 상자에 붙은 세 라벨이 모두 틀렸다. 한 상자에서 과일 하나만 꺼내 전체 라벨을 바로잡으려면 어느 상자에서 꺼내야 하는가?","answer":"혼합이라고 적힌 상자","hints":["모든 라벨이 틀렸다는 조건을 사용한다.","혼합 라벨 상자는 단일 과일만 들어 있다.","하나를 보면 그 상자의 실제 종류가 확정된다."],"explanation":"혼합 라벨 상자에서 하나를 꺼내 단일 종류를 확정하고 나머지는 소거한다.","options":["혼합이라고 적힌 상자","사과 라벨 상자","배 라벨 상자","아무 상자나 가능"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"all-labels-wrong"},{"id":"C007","category":"공포·기묘","title":"밤의 발소리","question":"혼자 사는 남자가 밤마다 일정한 간격으로 복도에서 발소리를 들었다. 집의 CCTV에는 아무도 없었다. 난방을 끄자 소리가 사라졌고 배관이 식는 동안 다시 한 번 소리가 났다. 원인은?","answer":"온도 변화로 배관이 팽창·수축하는 소리","hints":["사람이 아니라 건물에서 나는 소리일 수 있다.","난방 작동과 소리가 연관된다.","금속 배관은 온도에 따라 길이가 변한다."],"explanation":"배관의 열팽창과 수축으로 발생한 소리다.","options":["온도 변화로 배관이 팽창·수축하는 소리","유령","숨은 침입자","CCTV 고장"],"source":"original draft / classic reasoning where applicable","difficulty":"초급","mechanism":"thermal-expansion"},{"id":"C008","category":"암호","title":"거꾸로 읽는 메모","question":"메모에 713이라고 적혀 있다. 아래에는 '오른쪽부터 읽고 각 숫자에 1을 더하라'라고 쓰여 있다. 비밀번호는?","answer":"428","hints":["읽는 순서를 바꾼다.","713을 거꾸로 읽으면 317이다.","각 자리 숫자에 1을 더한다."],"explanation":"317의 각 자리에 1을 더하면 428이다.","options":["428","824","714","318"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"reverse-increment"},{"id":"C009","category":"상황·반전","title":"박수 없는 공연","question":"공연이 끝났는데 관객 모두 박수를 치지 않았다. 대신 손을 높이 들어 흔들었다. 공연자는 만족했다. 왜일까?","answer":"손을 흔드는 방식으로 박수를 표현해서","hints":["관객은 무관심하지 않았다.","박수는 꼭 소리를 내야 하는 것은 아니다.","손을 흔드는 시각적 박수 방식이다."],"explanation":"시각적 박수로 공연에 호응한 것이다.","options":["손을 흔드는 방식으로 박수를 표현해서","공연이 실패해서","화재 대피 중이라서","손을 다쳐서"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"visual-applause"},{"id":"C011","category":"범인 찾기","title":"잘못된 열쇠","question":"금고는 열쇠 X로만 열리며 복제본은 없다. 사건 순간 X는 경비실에 있었고 CCTV에 경비원 한 명이 X를 가져가 돌아오는 모습이 찍혔다. 다른 접근은 없었다. 누가 열었는가?","answer":"경비원","hints":["금고를 열기 위한 필수 조건은 무엇인가?","X는 복제할 수 없는 유일한 열쇠다.","사건 순간 X를 가져간 사람이 한 명이다."],"explanation":"유일한 열쇠를 사용한 사람은 경비원이다.","options":["경비원","청소원","방문객","관리자"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"exclusive-key"},{"id":"C012","category":"알리바이·거짓말","title":"동시 통화","question":"사건은 12시에 발생했고 현장 출입문 기록상 범인은 현장에 있었다. A는 12시 다른 도시에서 대면 회의 중이었다는 영상이 있고 B는 현장에서 자동 촬영됐다. C는 같은 시각 해외 출입국 심사 기록이 있다. 기록은 모두 정확하다. 범인은?","answer":"B","hints":["현장에 있어야 한다.","A와 C는 다른 장소에 있었다.","B만 현장에서 확인되었다."],"explanation":"현장에 있어야 한다는 조건으로 B만 남는다.","options":["B","A","C","판단 불가"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"location-exclusion"},{"id":"C013","category":"밀실·불가능","title":"사라진 그림자","question":"밀폐된 방의 벽에 비치던 조각상의 그림자가 사라졌다. 조각상 위치는 그대로이고 유일한 조명은 타이머에 연결돼 있었다. 왜 사라졌을까?","answer":"타이머가 조명을 껐다","hints":["그림자에는 빛이 필요하다.","조각상은 움직이지 않았다.","유일한 광원이 타이머로 꺼질 수 있다."],"explanation":"빛이 사라지면 투영되는 그림자도 없어지기 때문이다.","options":["타이머가 조명을 껐다","조각상이 이동했다","벽이 움직였다","누군가 그림자를 훔쳤다"],"source":"original draft / classic reasoning where applicable","difficulty":"초급","mechanism":"light-source-off"},{"id":"C014","category":"논리·수리","title":"다리 건너기","question":"네 사람이 각각 1, 2, 7, 10분 걸려 다리를 건넌다. 손전등은 하나, 최대 두 명이 함께 건너고 속도는 느린 사람 기준이다. 모두 건너는 최소 시간은?","answer":"17분","hints":["빠른 두 사람이 손전등을 운반하면 유리하다.","7분과 10분인 사람은 함께 건너게 하자.","2+1+10+2+2를 계산한다."],"explanation":"1·2가 건너고 1이 돌아와 7·10이 건넌 뒤 2가 돌아와 1·2가 건너면 17분이다.","options":["17분","19분","20분","21분"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"bridge-optimization"},{"id":"C015","category":"공포·기묘","title":"따라오는 불빛","question":"숲길에서 손전등을 든 사람이 뒤를 돌아볼 때마다 두 개의 빛이 보였다. 빛은 손전등을 끄면 사라졌다. 바로 뒤에는 고정된 반사판 두 개가 있었다. 원인은?","answer":"반사판이 손전등 빛을 반사했다","hints":["빛은 독립적으로 빛나지 않는다.","손전등이 꺼지면 빛도 사라진다.","반사판이 두 개 있다."],"explanation":"반사판에서 되돌아온 빛을 본 것이다.","options":["반사판이 손전등 빛을 반사했다","두 사람이 추적했다","유령이 나타났다","별빛이 움직였다"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"light-reflection"},{"id":"C016","category":"암호","title":"첫 글자의 메시지","question":"메모에 '동쪽 창문 / 문서 보관함 / 앞쪽 선반'이라고 쓰여 있고 '각 줄의 첫 글자'라는 지시가 있다. 숨은 메시지는?","answer":"동문앞","hints":["세 줄의 시작을 읽는다.","동쪽, 문서, 앞쪽의 첫 글자다.","순서대로 이어 붙인다."],"explanation":"동·문·앞을 연결하면 동문앞이다.","options":["동문앞","창문앞","동보선","문서함"],"source":"original draft / classic reasoning where applicable","difficulty":"초급","mechanism":"acrostic"},{"id":"C017","category":"상황·반전","title":"늦게 도착한 사람","question":"약속에 가장 늦게 도착한 사람이 상을 받았다. 참석자들은 모두 정해진 시간에 출발했으며 행사는 느리게 걷기 대회였다. 왜 상을 받았을까?","answer":"가장 느리게 완주했기 때문에","hints":["약속이 일반적인 모임이 아니다.","행사의 목표는 빠른 도착이 아니다.","느리게 걷기 대회라는 규칙을 보자."],"explanation":"가장 늦게 완주한 참가자가 우승했다.","options":["가장 느리게 완주했기 때문에","지각 벌칙을 받아서","심판이라서","길을 잃어서"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"reverse-race"},{"id":"C018","category":"일상 미스터리","title":"뒤집힌 숫자","question":"가게 직원은 진열대에 적힌 6을 보고 재고가 9개라고 말했다. 표지판이 거꾸로 설치된 사실을 알고 있었다. 왜?","answer":"거꾸로 보이는 6은 원래 9였다","hints":["숫자가 잘못 기록된 것은 아니다.","표지판 방향을 확인하자.","180도 돌리면 6과 9가 바뀐다."],"explanation":"거꾸로 설치된 표지판을 올바른 방향으로 해석했다.","options":["거꾸로 보이는 6은 원래 9였다","3개를 더 주문해서","가격을 읽어서","6을 잘못 세어서"],"source":"original draft / classic reasoning where applicable","difficulty":"중급","mechanism":"rotation-digit"},{"id":"C019","category":"논리·수리","title":"무게의 차이","question":"동일한 겉모습의 동전 9개 중 하나만 가볍다. 양팔 저울로 최소 몇 번이면 반드시 찾을 수 있는가?","answer":"2번","hints":["세 그룹으로 나눈다.","3개 대 3개를 비교하면 후보 3개가 남는다.","후보 중 1개 대 1개를 비교한다."],"explanation":"첫 비교로 후보 세 개, 두 번째 비교로 하나를 확정한다.","options":["2번","1번","3번","4번"],"source":"original draft / classic reasoning where applicable","difficulty":"초급","mechanism":"ternary-weighing"},{"id":"C020","category":"알리바이·거짓말","title":"꺼진 출입 기록","question":"연구소에는 카드 없이 열 수 없는 문이 하나 있다. 카드 기록에는 21:00부터 21:20까지 아무 입장도 없었다. 하지만 경비원이 21:10에 연구소 안에서 사람을 봤다. 카메라는 정상이고 기록도 정확하다. 가장 간단한 설명은?","answer":"그 사람이 21시 이전부터 안에 있었다","hints":["입장 기록이 없다는 것은 퇴장 기록이 없다는 말은 아니다.","기록이 비어 있는 시간에 문을 통과하지 않았을 수 있다.","그 사람의 입장 시점을 앞당겨 보자."],"explanation":"사람은 21시 이전에 입장했고 21시 10분까지 내부에 남아 있었다.","options":["그 사람이 21시 이전부터 안에 있었다","그가 벽을 통과했다","카드 기록이 고장났다","경비원이 환각을 봤다"],"source":"independently authored draft; needs editorial review","difficulty":"중급","mechanism":"prior-entry"},{"id":"C022","category":"논리·수리","title":"잘못 붙은 좌석표","question":"네 좌석에 1~4번 번호표를 하나씩 붙였다. 번호표는 모두 제자리에 없으며, 1번은 2번 자리에, 2번은 3번 자리에, 3번은 4번 자리에 붙어 있다. 4번 번호표는 어디에 붙어 있는가?","answer":"1번 자리","hints":["네 번호표는 서로 다른 자리에 있다.","2·3·4번 자리는 이미 사용했다.","남은 자리는 하나다."],"explanation":"번호표 4가 붙을 수 있는 빈자리는 1번 자리뿐이다.","options":["1번 자리","2번 자리","3번 자리","4번 자리"],"source":"independently authored draft; needs editorial review","difficulty":"중급","mechanism":"permutation-last"},{"id":"C023","category":"암호","title":"열쇠함의 날짜","question":"금고에는 숫자 네 자리가 필요하다. 메모에는 “11월 9일은 1109로 적는다. 3월 7일에 찾아와라”라고 쓰여 있다. 날짜 표시 규칙을 동일하게 적용할 때 암호는?","answer":"0307","hints":["월과 일을 각각 두 자리로 표시한다.","11월 9일이 1109로 적히는 이유를 보자.","3월은 03, 7일은 07이다."],"explanation":"월 03과 일 07을 합치면 0307이다.","options":["0307","3070","0703","0037"],"source":"independently authored draft; needs editorial review","difficulty":"중급","mechanism":"date-format"},{"id":"C026","category":"밀실·불가능","title":"안에서 잠긴 문","question":"기록 보관실의 문은 밖에서 닫아도 자동으로 잠기는 구조다. 마지막 퇴실자는 18시에 문을 닫았고, 19시에 관리자가 와서 문이 잠긴 것을 확인했다. 안에서는 사람을 찾지 못했다. 누가 19시에 안에서 문을 잠갔을까?","answer":"아무도 잠그지 않았다. 문이 자동으로 잠겼다","hints":["잠긴 문에 반드시 사람이 개입한 것은 아니다.","문은 닫을 때 작동하는 장치가 있다.","자동 잠금 구조를 확인하자."],"explanation":"18시에 마지막 퇴실자가 문을 닫으면서 자동으로 잠겼다.","options":["아무도 잠그지 않았다. 문이 자동으로 잠겼다","마지막 퇴실자","관리자","침입자"],"source":"independently authored draft; needs editorial review","difficulty":"중급","mechanism":"auto-lock"},{"id":"C029","category":"논리·수리","title":"색깔 봉투","question":"서랍에는 빨간 봉투 4개와 파란 봉투 4개가 있다. 불을 끄고 무작위로 꺼낼 때 반드시 같은 색 봉투 3개를 확보하려면 최소 몇 개를 꺼내야 할까?","answer":"5개","hints":["가장 불리한 경우를 상상하자.","빨간색 2개와 파란색 2개까지는 세 개가 없다.","다섯 번째 봉투는 반드시 한 색을 세 개 만든다."],"explanation":"4개까지는 각 색 2개씩일 수 있지만 5개째엔 비둘기집 원리에 의해 한 색이 3개가 된다.","options":["5개","3개","4개","6개"],"source":"independently authored draft; needs editorial review","difficulty":"중급","mechanism":"pigeonhole"},{"id":"C030","category":"논리·수리","title":"보관함의 순서","question":"보관함 A B C D에는 각각 지도, 열쇠, 편지, 사진이 하나씩 있다. 지도는 열쇠 바로 왼쪽, 사진은 맨 오른쪽이 아니다. 편지는 A에 있다. 왼쪽부터 A B C D일 때 사진은 어디에 있는가?","answer":"B","hints":["지도와 열쇠를 한 묶음으로 생각하자.","편지 때문에 지도는 A에 올 수 없다.","사진이 D에 오지 않으려면 지도와 열쇠는 C와 D에 있어야 한다."],"explanation":"A는 편지이고 지도와 열쇠는 BC 또는 CD다. BC일 경우 사진이 D이므로 불가능하다. 따라서 B가 사진이다.","options":["B","A","C","D"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"adjacency-placement"},{"id":"C031","category":"암호","title":"두 장의 필름","question":"투명 필름 두 장에 각각 4칸이 있다. 첫 장은 1번과 3번이 검고, 두 번째 장은 2번과 3번이 검다. 겹쳤을 때 정확히 한 장만 검은 칸의 번호를 작은 순서로 읽어라.","answer":"12","hints":["두 장 모두 검은 칸은 제외한다.","3번은 두 장 모두 검다.","1번과 2번만 한 장씩 검다."],"explanation":"검은 칸 집합의 대칭차는 1,2다.","options":["12","13","23","123"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"exclusive-or"},{"id":"C032","category":"일상 미스터리","title":"젖지 않은 종이","question":"투명한 빈 컵 안쪽 바닥에 마른 종이를 붙였다. 컵을 거꾸로 들고 기울이지 않은 채 물에 완전히 담갔다가 바로 꺼냈다. 종이는 마른 상태였다. 컵에는 구멍이 없다. 무엇이 종이를 보호했는가?","answer":"컵 안에 갇힌 공기","hints":["컵은 물에 잠겼지만 내부는 다를 수 있다.","거꾸로 된 컵 안의 기체는 빠져나갈 길이 없다.","갇힌 공기가 물의 유입을 막는다."],"explanation":"컵 내부 공기가 압축되며 물이 일부 들어갈 수 있지만 종이까지 도달하지 않은 것이다.","options":["컵 안에 갇힌 공기","종이의 방수 코팅","물이 증발함","컵 바닥의 자석"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"trapped-air"},{"id":"C033","category":"논리·수리","title":"서고의 시계","question":"시계 A는 매시간 실제보다 2분씩 빨라지고 B는 매시간 1분씩 느려진다. 정오에 동시에 정확히 맞췄다. 실제 오후 6시에 두 시계가 표시하는 시간의 차이는?","answer":"18분","hints":["실제 경과시간은 6시간이다.","A는 12분 앞서고 B는 6분 뒤처진다.","두 오차를 합한다."],"explanation":"서로 반대 방향으로 12분과 6분 차이가 누적된다.","options":["18분","6분","12분","24분"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"relative-drift"},{"id":"C034","category":"범인 찾기","title":"황동 명찰","question":"복도 카메라 영상에서 얼굴은 보이지 않지만 범인의 명찰에 찍힌 글자를 읽을 수 있다. 영상은 거울 속 모습을 촬영했으며 명찰의 원래 글자는 MOON, NOON, MOO, MOM 중 하나다. 영상에서 글자 순서가 NOOM으로 읽혔다면 원래 순서는? 글자 자체의 좌우 반전은 무시한다.","answer":"MOON","hints":["거울을 통한 촬영이다.","글자의 모양이 아니라 배열 순서를 보자.","NOOM을 뒤에서부터 읽는다."],"explanation":"영상상 좌우 순서의 반전으로 원래 배열은 MOON이다.","options":["MOON","NOON","MOO","MOM"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"mirror-word-order"},{"id":"C035","category":"논리·수리","title":"닫히는 수조","question":"수조에 물을 넣는 펌프 A는 매분 6L, 배수구 B는 매분 2L를 동시에 처리한다. 처음 비어 있고 용량은 28L다. 두 장치가 일정하게 작동할 때 가득 차기까지 몇 분인가?","answer":"7분","hints":["들어오는 물과 나가는 물이 동시에 있다.","매분 실제 증가량은 4L다.","28을 4로 나눈다."],"explanation":"순유입 4L/분이므로 7분이다.","options":["7분","4분","5분","14분"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"net-flow"},{"id":"C036","category":"밀실·불가능","title":"수평계의 기포","question":"밀폐된 유리관의 수평계 안에서 기포가 한쪽 끝으로 움직였다. 유리관은 깨지지 않았고 액체도 새지 않았다. 받침대 한쪽을 들어 올렸더니 기포가 이동했다. 기포가 향하는 쪽은?","answer":"높아진 끝","hints":["기포는 액체보다 밀도가 낮다.","기포에는 부력이 작용한다.","액체 속에서 기포는 위쪽으로 이동한다."],"explanation":"기울어진 관에서 기포는 높아진 쪽으로 이동한다.","options":["높아진 끝","낮아진 끝","항상 중앙","움직이지 않는다"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"buoyancy"},{"id":"C037","category":"알리바이·거짓말","title":"공연 순서표","question":"공연은 10시, 11시, 12시에 한 팀씩 열린다. 팀 A는 B보다 먼저 공연하고, C는 10시에 공연하지 않는다. B는 12시에 공연하지 않는다. 12시 공연 팀은?","answer":"C","hints":["B가 12시는 아니다.","A는 B보다 앞선다.","A와 B는 10시와 11시에 차례로 공연한다."],"explanation":"A가 10시이고 B가 11시일 수밖에 없어 C가 12시다.","options":["C","A","B","결정 불가"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"precedence-order"},{"id":"C038","category":"상황·반전","title":"위층의 안내문","question":"엘리베이터 수리 기사가 정상인 엘리베이터에 고장 안내문을 붙였다. 그날은 건물의 화재 대피 훈련일이었고 훈련 계획에는 모든 참가자가 계단으로 이동해야 한다고 기록돼 있다. 안내문의 목적은 무엇인가?","answer":"훈련 중 엘리베이터 이용을 막기 위해","hints":["실제 기계 고장은 아니다.","그날의 특별한 일정이 있다.","계단 대피 규칙을 지키도록 유도했다."],"explanation":"고장 안내는 훈련 중 이용 금지를 위한 임시 안내였다.","options":["훈련 중 엘리베이터 이용을 막기 위해","수리 비용을 올리기 위해","운행 기록을 지우기 위해","전력 고장을 알리기 위해"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"simulated-unavailability"},{"id":"C039","category":"암호","title":"봉투의 눈금","question":"잠금장치의 세 자리는 각각 독립적이다. 메모에는 첫째와 둘째의 합은 9, 둘째와 셋째의 합은 11, 첫째와 셋째의 합은 10이라고 적혀 있다. 세 숫자를 순서대로 입력하면?","answer":"456","hints":["세 식을 모두 더해 보자.","세 숫자의 합은 15다.","각각 15에서 나머지 두 숫자의 합을 빼면 된다."],"explanation":"첫째 4, 둘째 5, 셋째 6으로 모든 조건을 만족한다.","options":["456","546","465","654"],"source":"자체 작성 초안; 일반 논리·과학 원리","difficulty":"초급","mechanism":"pair-sum-system"}];

'use strict';
const $=id=>document.getElementById(id);const duration=300000;let deck=[],current=null,phase='home',deadline=0,tickId=0,revealed=0,solved=0,score=0,wrong=0,mode='normal',sound=false,ctx;
const shuffle=(a,r=Math.random)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const recent=()=>{try{return JSON.parse(localStorage.getItem('300-recent')||'[]').filter(x=>typeof x==='string')}catch{return []}};function remember(id){try{localStorage.setItem('300-recent',JSON.stringify([...recent().filter(x=>x!==id),id].slice(-Math.max(1,Math.min(60,BANK.length-1)))))}catch{}}
const best=()=>{try{return Number(localStorage.getItem('300-best'))||0}catch{return 0}};function save(){try{localStorage.setItem('300-best',String(Math.max(score,best())))}catch{}}
function show(v){for(const x of ['home','game','result'])$(x).hidden=x!==v}function beep(ok){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?660:220;g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.13)}catch{}}
const dayKey=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function usedDaily(){try{return localStorage.getItem('300-daily-attempt')===dayKey()}catch{return true}}function home(){clearInterval(tickId);phase='home';show('home');$('daily').disabled=usedDaily();$('daily').textContent=usedDaily()?'오늘의 사건 · 도전 완료':'오늘의 사건';$('record').textContent=`개인 최고 점수 ${best().toLocaleString()} · ${BANK.length}개 사건 (개발판)`}
function start(m='normal',category='all'){if(m==='daily'){if(usedDaily())return;try{localStorage.setItem('300-daily-attempt',dayKey())}catch{return}}mode=m;solved=score=wrong=0;const pool=category==='all'?BANK:BANK.filter(x=>x.category===category);const seen=new Set(recent());const unseen=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));deck=[...old,...unseen];if(m==='daily'){const d=dayKey();let hash=0;for(const c of d)hash=(hash*31+c.charCodeAt(0))>>>0;deck=[BANK[hash%BANK.length]]}show('game');load()}
function load(){clearInterval(tickId);if(!deck.length)return finish('모든 사건 해결',false);current=deck.pop();remember(current.id);phase='playing';revealed=wrong=0;deadline=Date.now()+duration;$('case').textContent=`CASE FILE · ${String(solved+1).padStart(3,'0')}`;$('score').textContent=`해결 ${solved} · ${score.toLocaleString()}점`;$('category').textContent=current.category+' / '+current.difficulty;$('title').textContent=current.title;$('question').textContent=current.question;$('feedback').textContent='';$('next').hidden=true;$('options').replaceChildren();for(const opt of shuffle(current.options)){const b=document.createElement('button');b.textContent=opt;b.onclick=()=>answer(opt,b);$('options').append(b)}renderClues();tick();tickId=setInterval(tick,100)}
function renderClues(){$('clues').replaceChildren();current.hints.forEach((h,i)=>{const b=document.createElement('button');b.textContent=`단서 ${i+1} · ${i<revealed?'공개됨':'열기'}`;b.disabled=i!==revealed||phase!=='playing';b.onclick=()=>{if(phase!=='playing'||Date.now()>=deadline)return tick();revealed++;renderClues()};$('clues').append(b);if(i<revealed){const p=document.createElement('p');p.textContent=h;$('clues').append(p)}})}
function tick(){if(phase!=='playing')return;const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;$('timer').classList.toggle('danger',left<=30);$('bar').value=left;if(!left)finish('시간 초과',true)}
function answer(opt,b){if(phase!=='playing')return;if(Date.now()>=deadline)return tick();if(opt!==current.answer){wrong++;b.disabled=true;b.classList.add('wrong');$('feedback').textContent='오답입니다. 남은 시간 안에 다시 추리하세요.';beep(false);return}phase='solved';clearInterval(tickId);solved++;score+=Math.max(100,1000+Math.ceil((deadline-Date.now())/1000)-revealed*150-wrong*100);save();$('score').textContent=`해결 ${solved} · ${score.toLocaleString()}점`;$('feedback').textContent='정답! '+current.explanation;for(const x of $('options').children)x.disabled=true;renderClues();$('next').hidden=false;$('next').textContent=deck.length?'다음 사건':'결과 보기';beep(true)}
function finish(title,reveal){clearInterval(tickId);phase='finished';save();$('resultTitle').textContent=title;$('resultStats').textContent=`해결 ${solved}건 · ${score.toLocaleString()}점`;$('resultExplanation').textContent=reveal&&current?`정답: ${current.answer} — ${current.explanation}`:'';show('result')}
for(const category of [...new Set(BANK.map(x=>x.category))]){const opt=document.createElement('option');opt.value=category;opt.textContent=category;$('categoryFilter').append(opt)}$('categoryStart').onclick=()=>start('normal',$('categoryFilter').value);$('start').onclick=()=>start();$('daily').onclick=()=>start('daily');$('again').onclick=()=>start();$('back').onclick=home;$('next').onclick=()=>{if(phase==='solved')load()};$('quit').onclick=()=>finish('게임 종료',phase==='playing');$('sound').onclick=()=>{sound=!sound;$('sound').textContent='소리 '+(sound?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(sound));if(sound)beep(true)};document.addEventListener('visibilitychange',tick);home();
</script></html>
