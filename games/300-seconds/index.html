3kg이다. 반드시 함께 실어야 하는 봉인 장비는 11kg, 나머지는 동일한 8kg 상자다. 적재한 상자는 모두 반출해야 하며 빈 카트 무게는 한도에 포함되지 않는다. 최대 상자 수는?","answer":"5개","hints":["봉인 장비를 먼저 적재한 뒤 남은 용량을 따져라."],"explanation":"53−11=42이고 42÷8의 정수 몫은 5다.","options":["4개","6개","5개","7개"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"중급","mechanism":"integer-capacity","estimatedSeconds":30},{"id":"C068","category":"상황·반전","title":"팔지 않는 마지막 빵","question":"빵집은 마지막 빵을 달라는 손님에게 판매를 거절했지만 진열품은 멀쩡했다. 매장 계량기는 매일 영업 중 기준 질량을 점검해야 하며 이 빵은 실제 식품과 모양이 같은 500g 검교정용 모형이라는 자산표가 붙어 있었다. 거절한 이유는?","answer":"판매용 식품이 아니라 계량기 점검용 기준물이어서","hints":["모양과 용도를 구분하라."],"explanation":"마지막 빵처럼 보이는 물건은 계량기를 검교정하는 기준 모형이므로 판매할 수 없다.","options":["이미 상한 빵이라서","손님의 결제 수단이 달라서","이미 다른 손님에게 팔려서","판매용 식품이 아니라 계량기 점검용 기준물이어서"],"source":"original draft / independent fictional scenario","difficulty":"중급","mechanism":"calibration-reference-disguise","estimatedSeconds":30},{"id":"C069","category":"범인 찾기","title":"사라진 도면의 버전","question":"유출 도면에는 수정 기호 R3과 R4가 있고 R5는 없다. A는 R2까지, B는 R4까지, C는 R5까지 다운로드했으며 D는 접근하지 않았다. 각자는 마지막 버전만 보관하고 이전 버전 사본은 없다. 각 버전에는 이전 수정 기호가 누적되며 유출 파일의 수정·공유는 없었다. R4 버전의 보관자는?","answer":"B","hints":["마지막 버전만 남는다."],"explanation":"R4에서 끝난 도면을 보유한 사람은 B뿐이다.","options":["D","B","C","A"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"중급","mechanism":"revision-lineage","estimatedSeconds":30},{"id":"C070","category":"상황·반전","title":"늦게 도착한 꽃","question":"한 사람이 사망한 뒤에도 매달 같은 날 꽃이 배달된다. 꽃집 계약서에는 생전에 12회분을 선결제하고 지정일에 자동 발송하도록 약정했다고 적혀 있다. 이유는?","answer":"생전에 예약한 정기 배송","hints":["주문일과 배송일을 구분하라."],"explanation":"선결제 정기 배송 계약은 주문자의 사망 후에도 예정대로 이행될 수 있다.","options":["수령인이 대신 주문했다","생전에 예약한 정기 배송","사망 기록이 틀렸다","꽃집이 매번 새 주문을 받았다"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"중급","mechanism":"scheduled-delivery","estimatedSeconds":30},{"id":"C071","category":"문서 추리","title":"찢긴 격자 카드","question":"계약서의 첨부표에는 1행 A B C, 2행 D E F, 3행 G H I가 있고 수정 대상은 행·열 좌표로 기재한다. 본문에는 (3,2), (1,1), (2,3)의 순서로만 수정한다고 되어 있다. 행·열은 1부터 센다. 첨부 변경 이력 중 본문과 일치하는 것은?","answer":"HAF","hints":["좌표의 두 성분이 가리키는 방향을 구분하라."],"explanation":"(3,2)=H, (1,1)=A, (2,3)=F이므로 HAF다.","options":["HAF","FAH","HBF","GAC"],"source":"original draft / independent fictional scenario","difficulty":"중급","mechanism":"document-grid-reference","estimatedSeconds":30},{"id":"C072","category":"공포·심리·기묘","title":"거울 없는 얼굴","question":"폐가의 복도 끝에서 사람 얼굴처럼 보이는 무늬가 나타났다. 가까이 가면 나뭇결로만 보이고, 사진을 180도 돌리면 얼굴처럼 보이는 인상이 크게 줄었다. 무늬 자체는 움직이지 않고 조명도 유지된다. 가장 적합한 설명은?","answer":"무작위 무늬를 얼굴로 인식하는 시각적 경향","hints":["무늬 자체는 변하지 않는다."],"explanation":"파레이돌리아는 불규칙한 무늬에서 의미 있는 형태를 지각하는 현상이다. 물리적 얼굴이나 움직임 증거는 없다.","options":["사진이 다른 시각에 촬영됐다","무작위 무늬를 얼굴로 인식하는 시각적 경향","벽 뒤에 사람이 숨었다","거울이 얼굴을 반사했다"],"source":"original draft / independent fictional scenario","difficulty":"중급","mechanism":"face-pareidolia","estimatedSeconds":30},{"id":"C073","category":"알리바이·거짓말","title":"기록의 빈 페이지","question":"수첩은 홀수 번호가 각 종이 앞면, 그 다음 짝수가 뒷면이다. 펼친 상태에서 왼쪽 30쪽과 오른쪽 33쪽이 마주하며 그 사이에 찢긴 종이의 흔적이 하나 있다. 빠진 종이의 양면 번호는?","answer":"31쪽과 32쪽","hints":["한 종이에는 연속한 두 번호가 있다."],"explanation":"31과 32가 한 종이 양면이며, 이 한 장이 빠져 30과 33이 마주 보인다.","options":["32쪽과 33쪽","31쪽과 33쪽","30쪽과 31쪽","31쪽과 32쪽"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"중급","mechanism":"pagination-gap","estimatedSeconds":30},{"id":"C074","category":"공포·심리·기묘","title":"복도 끝의 소실","question":"야간 복도에서 검은 형체가 일정 위치에서만 사라지는 것처럼 보인다. 실험에서 형체 뒤 조명은 일정했고, 관찰창에 붙은 두 편광 필터 중 하나를 돌렸을 때만 사라졌다. 이상적인 선편광 필터라면 두 투과축이 어떤 관계일 때 빛이 차단되는가?","answer":"직각","hints":["관찰창의 필터가 핵심이다."],"explanation":"이상적인 선편광 필터의 투과축이 직각이면 두 번째 필터에서 빛이 차단된다.","options":["60도","30도","평행","직각"],"source":"original draft / independent fictional scenario","difficulty":"중급","mechanism":"crossed-polarizer-disappearance","estimatedSeconds":30},{"id":"C075","category":"밀실·불가능","title":"천장에 붙은 조각","question":"건조한 전시실에서 문지른 플라스틱 판 가까이에 가벼운 종이 조각이 달라붙었다. 접착제와 자석은 없고 판은 전기를 띠고 있다. 원인은?","answer":"정전기적 인력","hints":["마찰 뒤 전하가 생겼다."],"explanation":"대전된 판이 종이의 전하 분포를 변화시켜 끌어당길 수 있다.","options":["정전기적 인력","기압의 완전한 소멸","중력의 소멸","종이의 강자성"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"중급","mechanism":"static-attraction","estimatedSeconds":30},{"id":"C076","category":"공포·심리·기묘","title":"벽 속의 대답","question":"빈 터널에서 한 사람이 소리를 내면 0.4초 뒤 같은 소리가 돌아왔다. 음속은 340m/s이고 반사면은 한 곳이며 왕복 경로는 직선이다. 조사팀은 34m, 68m, 136m, 170m 지점의 벽을 후보로 두었다. 어느 벽이 대답의 원인인가?","answer":"68m","hints":["소리가 돌아오기까지의 시간은 한 방향 이동 시간이 아니다."],"explanation":"왕복 136m이므로 반사면은 68m 지점이다.","options":["136m","34m","68m","170m"],"source":"original draft / independent fictional scenario","difficulty":"중급","mechanism":"echo-ranging","estimatedSeconds":30},{"id":"C077","category":"논리·수리","title":"잠긴 금고의 확률","question":"주머니에 검은 열쇠 3개와 은색 열쇠 2개가 있다. 무작위로 두 개를 순서대로 뽑고 되넣지 않는다. 두 개 모두 은색일 확률은?","answer":"1/10","hints":["두 번째 추출에서는 주머니 속 열쇠 수가 달라진다."],"explanation":"비복원 추출이므로 2/5×1/4=1/10이다.","options":["1/4","1/5","2/5","1/10"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"중급","mechanism":"finite-without-replacement","estimatedSeconds":30},{"id":"C078","category":"범인 찾기","title":"끊어진 바닥 자국","question":"미술관의 도난품은 전시대를 바깥으로 옮긴 뒤에만 꺼낼 수 있다. 전시대는 바닥을 계속 누르고 있으면 접촉 자국이 유지되며, 한 번 들면 자국이 끊긴다. 사건 직후 네 작업자의 개인 구역에서 전시대가 발견됐다. A의 구역은 사건 전부터 전시대 자국이 이어졌고, B는 사건 동안 자국이 끊긴 뒤 새 자국이 생겼다. C는 전시대 자국이 없고 D의 새 자국은 흰색 원형 받침에서 생겼다. 도난 전시대는 검은색 사각 받침이며 깨끗한 바닥에 반드시 검은 사각 자국을 남긴다. B의 새 자국만 검은 사각이었다. 사건 중 도난 전시대를 이동시킨 구역은?","answer":"B","hints":["오래된 자국과 사건 중 새로 생긴 자국을 구분하라."],"explanation":"A는 이동한 흔적이 없고 C는 자국이 없다. D의 받침 모양도 다르다. 사건 중 검은 사각 자국이 새로 생긴 B만 해당한다.","options":["B","C","A","D"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"trace-discontinuity","estimatedSeconds":45},{"id":"C079","category":"밀실·불가능","title":"멎은 모래시계","question":"밀봉된 모래시계가 정상 방향인데 모래가 남은 채 멈췄다. 내부 기압과 온도는 정상이고 입자들은 건조해 달라붙지 않는다. 목의 폭은 입자 하나보다 넓지만 입자 서너 개보다 좁다. 흔들자 흐르다가 같은 지점에서 다시 멈췄다. 확대 영상에서는 목의 양쪽 벽에 입자가 걸리고 가운데 입자들이 그 사이에서 지지되는 모습이 보인다. 무엇이 흐름을 막았는가?","answer":"입자의 아치형 걸림","hints":["목 부분의 구조를 확인하라."],"explanation":"입자들이 좁은 목에 하중을 전달하는 아치를 형성해 막힘이 생긴다. 흔들림으로 아치가 깨졌다가 다시 만들어질 수 있다.","options":["유리의 투과율 변화","입자의 아치형 걸림","중력 방향 반전","모래의 질량 소멸"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"granular-jamming","estimatedSeconds":45},{"id":"C080","category":"알리바이·거짓말","title":"한 장의 출동 일지","question":"창고 경보는 21:14~21:16 사이에 발생했다. A는 21:10에 창고에서 최소 8분 거리인 역에 도착했고 21:20까지 떠날 수 없었다. B는 21:05에 창고에서 6분 거리인 카페를 떠나 21:22에 돌아왔다. C는 창고에서 12분 거리의 병원에 21:08~21:18 머물렀다. D는 21:12에 창고에서 9분 거리인 사무실을 출발했다. 경보 순간 창고에 도착할 수 있었던 유일한 사람은?","answer":"B","hints":["각자의 이동 가능 시간을 구한다."],"explanation":"B는 21:11부터 21:16까지 창고에 머물 수 있으며 다른 후보는 경보 시간에 도착할 수 없다.","options":["A","D","B","C"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"travel-window","estimatedSeconds":45},{"id":"C081","category":"논리·수리","title":"세 갈래 배수로","question":"저수조의 물이 120L다. 유입은 분당 9L, 배출관 A는 분당 4L, B는 분당 3L다. 처음 10분간 모두 작동하고 이후 B만 닫은 채 8분이 지났다. 최종 물의 양은? 넘침은 없다.","answer":"180L","hints":["밸브를 닫기 전후를 서로 다른 구간으로 계산하라."],"explanation":"두 구간에서 각각 20L, 40L 증가해 180L다.","options":["192L","160L","180L","172L"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"flow-conservation","estimatedSeconds":45},{"id":"C082","category":"암호·논리","title":"네 개의 스탬프","question":"암호 장치의 한 번 작동은 원문 네 글자를 세 번째, 첫 번째, 네 번째, 두 번째 순으로 출력한다. 같은 장치를 연달아 두 번 적용한 출력이 E R A T라면 원문은?","answer":"TARE","hints":["장치를 한 번 거친 위치에 같은 규칙을 다시 적용하라."],"explanation":"두 번 변환하면 [4,3,2,1]이 되므로 ERAT의 원문은 TARE다.","options":["RATE","TEAR","TARE","ATER"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"permutation-encoding","estimatedSeconds":45},{"id":"C083","category":"밀실·불가능","title":"밀봉된 유리관","question":"밀봉한 투명 관 안에 작은 공기방울이 있다. 관을 눕힌 채 양끝 온도를 다르게 하자 액체가 이동하며 기포 길이가 달라졌다. 관은 단단하고 전체 부피는 고정이며 누출은 없다. 온도를 원래대로 되돌리면 기포도 원래 길이로 돌아온다. 가장 적합한 원인은?","answer":"액체와 기체의 열팽창 및 압력 평형 변화","hints":["물질은 관 밖으로 나가지 않는다."],"explanation":"밀봉 상태에서도 온도에 따른 액체·기체 부피 및 압력 평형 변화로 기포 크기가 달라질 수 있다. 영구변형이나 누출은 관찰과 맞지 않는다.","options":["관의 길이가 영구적으로 늘었다","내부 공기가 완전히 사라졌다","액체와 기체의 열팽창 및 압력 평형 변화","외부 공기가 유입됐다"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"sealed-bubble-equilibrium","estimatedSeconds":45},{"id":"C084","category":"상황·반전","title":"두 번 팔린 좌석","question":"공연장 좌석 X에 같은 날짜의 오전권 1장과 오후권 1장이 팔렸다. 직원은 두 구매자에게 동시에 좌석을 쓸 수 없다고 설명하자 한 명이 환불을 요구했다. 규정은 오전권 10~12시, 오후권 14~16시이며 날짜 통합권은 판매하지 않는다. 두 티켓을 모두 유효하다고 판단할 근거는?","answer":"사용 시간대가 겹치지 않는다","hints":["번호는 같아도 권리 범위가 다르다."],"explanation":"두 티켓은 같은 좌석을 서로 다른 시간에 사용하는 권리라서 중복 판매가 아니다.","options":["좌석을 두 개로 분리했다","오전권은 무효다","사용 시간대가 겹치지 않는다","좌석 번호가 다르다"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"time-sliced-seat-rights","estimatedSeconds":45},{"id":"C085","category":"논리·수리","title":"보험금의 경계","question":"물품 피해액 중 첫 20만원에는 50%, 초과액에는 80%를 보상한다. 총 피해액은 65만원이며 보상 한도는 50만원이다. 실제 지급액은?","answer":"46만원","hints":["첫 20만원 보상은 10만원이다."],"explanation":"10+36=46만원이며 한도 이하이다.","options":["52만원","42만원","46만원","50만원"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"piecewise-rate","estimatedSeconds":45},{"id":"C086","category":"범인 찾기","title":"서로 다른 접속 흔적","question":"서버의 삭제 권한은 A·B·C, 원격 접속 권한은 B·C·D에게 있다. 사건은 원격 삭제였고 같은 시각 C의 계정은 관리자가 잠가 사용 불가능했다. 계정 공유는 없다. 실행 가능한 사람은?","answer":"B","hints":["두 권한의 교집합을 찾는다."],"explanation":"원격 삭제에 필요한 두 권한을 동시에 사용 가능한 사람은 B뿐이다.","options":["A","B","C","D"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"set-difference","estimatedSeconds":45},{"id":"C087","category":"알리바이·거짓말","title":"뒤집힌 압력 기록","question":"검사 기록상 용의자는 21:00에 두 압력계가 같은 실제 압력을 표시했다고 진술했다. A는 실제 10에서 14, 실제 30에서 38을 표시하며 선형이다. B는 실제보다 4 낮게 표시한다. 당시 A=26, B=19였다. 어느 판단이 정확한가?","answer":"B가 A보다 실제값 3 높다","hints":["두 계기의 표시값을 공통 기준의 실제값으로 환산하라."],"explanation":"A 실제값은 (26−2)/1.2=20, B는 19+4=23이다. B가 3 높으므로 같은 압력이라는 진술은 틀렸다.","options":["B가 A보다 실제값 3 높다","실제값이 둘 다 20이다","실제값 차이는 7이다","A가 B보다 실제값 3 높다"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"instrument-calibrated-testimony","estimatedSeconds":45},{"id":"C088","category":"밀실·불가능","title":"뒤틀린 진열대","question":"진열대의 지지대 두 개는 같은 플라스틱 재질이다. 제조 직후에는 높이와 모양이 같았고 동일 온도에 있었다. 한쪽에만 한 달간 일정한 하중을 걸었다. 하중을 제거한 직후에도 그쪽이 낮아져 있었고 재료에는 파손이나 용융 흔적이 없다. 보고서에 따르면 이 재질은 장시간 하중에서 시간 의존 변형과 일부 잔류 변형이 발생한다. 원인은?","answer":"지속 하중에 의한 크리프","hints":["두 지지대의 초기 조건은 같다."],"explanation":"장시간 하중에 따른 시간 의존 변형인 크리프가 관찰 조건과 일치한다.","options":["지속 하중에 의한 크리프","두 지지대의 최초 높이 차이","순간 탄성 변형만 발생","플라스틱의 용융"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"creep-deformation","estimatedSeconds":45},{"id":"C089","category":"알리바이·거짓말","title":"두 색의 손목띠","question":"공연장에서는 18시 이전 입장객에게 흰 띠, 18시 이후에는 검은 띠를 지급한다. 퇴장할 때 띠를 반납하고 재입장자는 현재 시각의 새 띠를 받는다. A는 17:50에 들어와 공연 내내 한 번도 퇴장하지 않았다고 주장했다. 18:30 사진에서 A는 검은 띠를 차고 있었고 띠 교환·분실·발급 오류는 없다. 무엇을 확정할 수 있는가?","answer":"A는 18시 이후 적어도 한 번 입장했다","hints":["띠의 색은 마지막 입장 시점과 관련된다."],"explanation":"검은 띠는 18시 이후 입장 때만 받는다. 따라서 17:50 입장 후 계속 있었다는 주장은 성립하지 않는다. 최초 입장 여부는 확정할 수 없다.","options":["A는 18:30 이후에 퇴장했다","A는 18시 이후 적어도 한 번 입장했다","A는 18시 이전에 입장하지 않았다","A는 공연을 보지 않았다"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"reentry-token-state","estimatedSeconds":45},{"id":"C090","category":"상황·반전","title":"값이 돌아온 보석","question":"보석상은 처음 가격의 20%를 할인했다가 할인된 가격을 25% 올린 뒤 손님에게 가격이 원래와 같다고 안내했다. 원래 가격을 모르는 손님은 두 변동률 합계가 +5%라며 항의했다. 최종 가격은 96만원이고 다른 변동은 없었다. 점원의 설명이 맞는 이유는?","answer":"두 비율의 기준 가격이 달라 곱이 1이다","hints":["두 번째 비율의 기준은 할인 후 가격이다."],"explanation":"0.8×1.25=1이므로 최초와 최종은 모두 96만원이다. 할인 금액과 인상 금액이 같아지는 이유는 서로 다른 기준 가격에 비율을 적용했기 때문이다.","options":["처음 가격과 할인된 가격에 같은 비율을 적용했다","두 비율의 기준 가격이 달라 곱이 1이다","최종 가격은 처음보다 5% 높다","할인률을 더하면 0이다"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"successive-rate-reversal","estimatedSeconds":45},{"id":"C091","category":"복합 추리","title":"무효가 된 증거 카드","question":"보안 장치는 세 증거 카드의 점수를 합산해 7점 이상일 때 문을 연다. 카드 A는 4점, B는 3점, C는 5점이다. 다만 A와 C가 동시에 들어오면 두 카드는 모두 무효이고, B는 다른 유효 카드가 하나 이상 있을 때만 인정된다. 모든 카드의 삽입 기록은 정확하다. 다음 중 문을 열 수 있는 삽입 조합은?","answer":"A와 B만","hints":["카드의 점수를 더하기 전에 무효 조건을 적용하라."],"explanation":"A+B=7점이다. A+C는 모두 무효, B 단독은 조건 미충족, 세 카드 전부 삽입 시 A와 C가 무효이고 B도 단독으로 남아 인정되지 않는다.","options":["A와 C만","A와 B만","B만","A·B·C 모두"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"conditional-evidence-scoring","estimatedSeconds":45},{"id":"C092","category":"공포·심리·기묘","title":"새벽의 낮은 울림","question":"폐극장의 특정 좌석에서만 낮은 울림이 유난히 크게 들린다. 같은 주파수의 두 스피커를 하나씩 끄면 울림은 약해지고, 둘을 켜면 좌석 P에서는 최대, Q에서는 거의 들리지 않는다. 스피커는 같은 위상이고 음파의 세기는 비슷하다. P와 Q의 차이를 가장 잘 설명하는 것은?","answer":"P에서는 두 파동이 보강되고 Q에서는 상쇄된다","hints":["두 스피커가 함께 작동할 때만 차이가 크다."],"explanation":"경로차 때문에 P에서는 보강 간섭, Q에서는 상쇄 간섭이 일어날 수 있다.","options":["P에서는 두 파동이 보강되고 Q에서는 상쇄된다","P에서만 음속이 두 배다","Q에서는 소리가 생성되지 않는다","좌석마다 스피커 주파수가 바뀐다"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"acoustic-interference-seat","estimatedSeconds":45},{"id":"C093","category":"범인 찾기","title":"붉어진 봉인","question":"창고의 기밀 봉투에는 투명한 보호 필름이 붙어 있었다. 필름은 제거하면 붉은 봉인 문구가 드러나고 다시 가릴 수 없다. 네 사람은 각각 다른 시간대에 혼자 봉투를 검사했으며, A 검사 직후의 사진에는 문구가 없었다. B 검사 직후 사진은 초점이 맞지 않아 판단할 수 없었다. C 검사 시작 직전 사진에는 붉은 문구가 보였고 D는 그 이후 검사했다. 사진은 모두 실제 시각 순서대로 촬영됐고 검사 사이에는 아무도 봉투에 접근하지 않았다. 필름을 제거한 사람은?","answer":"B","hints":["되돌릴 수 없는 상태 변화가 어느 구간에서 처음 발생했는지 살펴라."],"explanation":"A 직후에는 미제거, C 직전에는 제거 상태다. 그 사이 봉투에 접근할 수 있었던 사람은 B뿐이다.","options":["D","B","C","A"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"irreversible-state-bracket","estimatedSeconds":45},{"id":"C094","category":"공포·심리·기묘","title":"눈을 감아도 보이는 형체","question":"폐극장에서 잠깐 밝은 녹색 형체를 바라본 관람객이 조명이 정상으로 돌아온 뒤에도 흰 벽에서 붉은 자국 같은 형체를 보았다. 눈을 감거나 시선을 옮겨도 잠시 따라왔고, 시간이 지나며 사라졌다. 다른 관람객의 영상에는 자국이 없다. 가장 적합한 설명은?","answer":"시각 적응에 따른 잔상","hints":["형체가 벽에 고정돼 있지 않다."],"explanation":"색 자극 후 시각 적응에 의한 잔상이 나타날 수 있다. 시선 이동과 함께 보이고 서서히 사라지는 관찰과 맞는다.","options":["벽에 새 그림이 투사됐다","벽지가 실제로 움직였다","공기의 온도가 갑자기 낮아졌다","시각 적응에 따른 잔상"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"chromatic-afterimage","estimatedSeconds":45},{"id":"C095","category":"논리·수리","title":"경매장의 입찰","question":"경매 규칙은 최고 입찰자가 낙찰받고 두 번째로 높은 금액에 2만원을 더해 지불한다. 단 지불액은 최고 입찰액을 넘지 않는다. 입찰액은 31, 32, 35, 36만원이다. 낙찰자의 지불액은?","answer":"36만원","hints":["두 번째 입찰액으로 계산한 뒤 상한을 확인하라."],"explanation":"규칙상 min(36,35+2)=36만원이다.","options":["34만원","37만원","36만원","35만원"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"second-price-auction","estimatedSeconds":45},{"id":"C096","category":"문서 추리","title":"정정된 서류철","question":"서류철 스캐너의 누적 카운터는 000~999를 순환하며 한 장 스캔할 때 1씩 증가한다. 오전 시작 값은 976, 정오 값은 018, 종료 값은 046이다. 각 구간에서 1000장 미만을 스캔했다. 오전에 스캔한 양은 오후보다 몇 장 더 많은가?","answer":"14장","hints":["오전에는 카운터가 999에서 000으로 넘어갔다."],"explanation":"(1000−976+18)−(46−18)=42−28=14다.","options":["42장","12장","14장","16장"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"고급","mechanism":"cumulative-counter-rollover","estimatedSeconds":45},{"id":"C097","category":"상황·반전","title":"되돌아온 보증금","question":"장비 대여자는 보증금 50,000원 중 43,000원을 돌려받았다. 계약서에는 파손 부품 비용에서 정상 마모 공제액을 뺀 금액만 보증금에서 차감한다고 적혀 있다. 반납표에 적힌 부품 비용은 10,000원, 정상 마모 공제액은 3,000원이다. 대여료는 이미 별도 결제했다. 기록에 맞는 정산 방식은?","answer":"보증금에서 순수 파손 비용 7,000원 차감","hints":["계약상 정상 마모액은 이용자 부담에서 제외된다."],"explanation":"10,000−3,000=7,000원이며 50,000−7,000=43,000원이다. 대여료와 별도인 보증금 정산이다.","options":["부품 비용 전액 10,000원 차감","대여료 7,000원 추가 청구","보증금에서 순수 파손 비용 7,000원 차감","정상 마모액 3,000원만 차감"],"source":"original draft / independent fictional scenario","difficulty":"고급","mechanism":"wear-adjusted-deposit","estimatedSeconds":45},{"id":"C098","category":"복합 추리","title":"세 구역의 봉쇄","question":"창고 S에서 금고 T까지 통로는 S-A 4분, S-B 2분, A-B 1분, A-T 5분, B-T 9분이다. 양방향 이동 가능하며 A-T는 출발 6분 뒤 봉쇄되므로 통과를 6분 전에 끝내야 한다. 그 외 통로는 열린다. 최단 도착시간은?","answer":"11분","hints":["가장 빠른 통과 시작 시각과 통과 완료 시각을 구분하라."],"explanation":"A-T는 모든 경로에서 통과 완료가 8분 이후라 불가하다. S-B-T는 2+9=11분이다.","options":["11분","12분","9분","8분"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"최고급","mechanism":"graph-shortest-path","estimatedSeconds":70},{"id":"C099","category":"범인 찾기","title":"끊긴 거래의 연결","question":"기밀 봉인 기록 다섯 개는 각 출력번호가 다음 입력번호와 같아야 한다. A=(0,4), B=(4,7), C=(4,2), D=(7,4), E=(2,9). 0에서 출발해 9에서 끝나며 모두 한 번씩 사용한다. 범인은 세 번째 단계의 기록을 직접 작성한 사람이고 각 기록 작성자는 해당 알파벳의 담당자다. 범인은?","answer":"D","hints":["중간에 끝 번호 9로 들어가면 남은 기록을 사용할 수 있는지 확인하라."],"explanation":"전체 순서는 A-B-D-C-E뿐이다. 세 번째 기록은 D다.","options":["A","D","C","B"],"source":"original draft / independent fictional scenario","difficulty":"최고급","mechanism":"directed-record-trail","estimatedSeconds":70},{"id":"C100","category":"논리·수리","title":"금고의 세 손잡이","question":"세 손잡이 값 x,y,z는 서로 다른 1~6의 정수다. x+y+z=11, 2x+y=12이고 x는 y보다 크다. 올바른 (x,y,z)는?","answer":"5,2,4","hints":["두 식을 빼서 z를 x로 표현할 수 있다."],"explanation":"가능한 x는 3,4,5이고 (3,6,2)는 x>y에 위배, (4,4,3)은 중복이다. (5,2,4)만 남는다.","options":["4,4,3","5,2,4","6,1,4","3,6,2"],"source":"original draft / independent scenario; general reasoning principles","difficulty":"최고급","mechanism":"bounded-diophantine","estimatedSeconds":70},{"id":"C101","category":"밀실·불가능","title":"폐쇄된 분기점","question":"봉인된 관제실 내부 수조로 물이 들어오는 통로는 const $=id=>document.getElementById(id), duration=300000, MAX_CLUES=3;
const DIFFICULTY_ORDER={"최상급":4,"상급":3,"중급":2,"초급":1};
const caseImageCache=new Map();
async function caseImageData(id){if(caseImageCache.has(id))return caseImageCache.get(id);const p=fetch("assets/hq/"+id+".b64?v=20261114-new100",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error("image");return r.text()}).then(t=>"data:image/webp;base64,"+t.trim());caseImageCache.set(id,p);return p}
async function showCaseImage(item){const el=$("caseImage");el.classList.add("loading");el.style.backgroundImage="";try{const src=await caseImageData(item.id);if(current?.id!==item.id)return;el.style.backgroundImage="url("+src+")";el.classList.remove("loading")}catch{el.classList.remove("loading");caseImageCache.delete(item.id)}}
function preloadNextCase(){const next=deck[deck.length-1];if(next)caseImageData(next.id).catch(()=>{})}
let roundSize=0,deck=[],current=null,phase="home",deadline=0,tickId=0,revealed=0,solved=0,score=0,wrong=0,hintsUsed=0,mode="normal";
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let activeDay="";
function resetDailyStorage(day){try{if(localStorage.getItem("300-storage-day")!==day){for(const k of ["300-best-v4","300-nickname","300-daily-attempt","300-recent"])localStorage.removeItem(k);localStorage.setItem("300-storage-day",day)}}catch{}}
const best=()=>{try{return Number(localStorage.getItem("300-best-v4"))||0}catch{return 0}};
const getNick=()=>{try{return localStorage.getItem("300-nickname")||""}catch{return ""}};
const validNick=n=>/^[가-힣A-Za-z0-9_]{2,12}$/.test((n||"").trim().normalize("NFKC"));
const dayKey=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
function checkDay(){const day=dayKey();resetDailyStorage(day);if(!activeDay){activeDay=day;return true}if(activeDay===day)return true;activeDay=day;clearInterval(tickId);score=solved=hintsUsed=wrong=revealed=0;deck=[];current=null;home();return false}
function recent(){try{return JSON.parse(localStorage.getItem("300-recent")||"[]")}catch{return[]}}
function remember(id){try{localStorage.setItem("300-recent",JSON.stringify([...recent().filter(x=>x!==id),id].slice(-24)))}catch{}}
function saveBest(){try{localStorage.setItem("300-best-v4",String(Math.max(best(),score)))}catch{}}
function show(v){["home","game","result","records","rankings"].forEach(x=>$(x).classList.toggle("active",x===v));window.scrollTo(0,0)}
function updateBestUI(serverBest=0){const v=Math.max(best(),Number(serverBest)||0);$("homeBest").textContent=v.toLocaleString()+"점";$("homeBestSub").textContent=v?"개인 최고 점수":"아직 기록 없음";$("record").textContent=v.toLocaleString()+"점"}
function saveNickname(){if(!checkDay())return;const n=$("nickname").value.trim().normalize("NFKC");if(!validNick(n)){alert("닉네임은 한글·영문·숫자·밑줄 2~12자로 입력하세요.");return false}try{if(getNick()!==n)localStorage.removeItem("300-best-v4");localStorage.setItem("300-nickname",n)}catch{};$("nickname").value=n;loadLeaderboard();return true}
function ensureNick(){if(validNick(getNick()))return true;alert("오늘의 TOP5 등록을 위해 닉네임을 먼저 저장하세요.");$("nickname").focus();return false}
function fillRanks(rows){$("leaderboard").replaceChildren();$("leaderStatus").textContent=rows.length?"":"아직 오늘 등록된 기록이 없습니다.";rows.slice(0,5).forEach(row=>{const d=document.createElement("div"),a=document.createElement("div"),b=document.createElement("div"),c=document.createElement("div");d.className="rankRow";a.className="rankNum";a.textContent=row.rank;b.className="rankName";b.textContent=row.nickname;c.className="rankScore";c.textContent=Number(row.score).toLocaleString()+"점";d.append(a,b,c);$("leaderboard").append(d)})}
async function loadLeaderboard(){const requestedDay=dayKey();const n=getNick();try{const r=await fetch("/api/300-seconds/rankings"+(validNick(n)?"?nickname="+encodeURIComponent(n):""),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(d.notice)throw 0;if(requestedDay!==dayKey()||d.day!==requestedDay||n!==getNick())return;fillRanks(Array.isArray(d.daily)?d.daily:[]);updateBestUI(d.mine&&d.mine.score)}catch{if(requestedDay!==dayKey()||n!==getNick())return;$("leaderStatus").textContent="랭킹 서버 연결 전";updateBestUI()}}
async function submitRanking(){if(activeDay!==dayKey()||score<=0||!validNick(getNick()))return;try{await fetch("/api/300-seconds/rankings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nickname:getNick(),score,solved,hints:hintsUsed,mode,day:activeDay})})}catch{}}
function home(){resetDailyStorage(dayKey());activeDay=dayKey();clearInterval(tickId);phase="home";fillRanks([]);show("home");$("nickname").value=getNick();$("daily").disabled=false;$("daily").textContent="오늘의 사건";updateBestUI();loadLeaderboard()}
function makeDeck(category){const pool=category==="all"?BANK:BANK.filter(x=>x.category===category);const seen=new Set(recent());return [...shuffle(pool.filter(x=>seen.has(x.id))),...shuffle(pool.filter(x=>!seen.has(x.id)))]}
function start(m="normal",category="all"){if(!checkDay()||!ensureNick())return;mode=m;solved=score=wrong=hintsUsed=0;deck=makeDeck(category);if(m==="daily"){let h=0;for(const c of dayKey())h=(h*31+c.charCodeAt(0))>>>0;deck=[...BANK];for(let i=deck.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;const j=h%(i+1);[deck[i],deck[j]]=[deck[j],deck[i]]}}roundSize=deck.length;deadline=Date.now()+duration;show("game");load()}
function load(){clearInterval(tickId);if(!deck.length)return finish("모든 사건 해결",false);if(Date.now()>=deadline)return finish("시간 초과",false);current=deck.pop();remember(current.id);phase="playing";revealed=wrong=0;$("case").textContent=String(solved+1).padStart(2,"0")+" / "+roundSize;$("score").textContent=score.toLocaleString()+"점";$("scoreMirror").textContent=score.toLocaleString()+"점";$("solvedText").textContent="정답 "+solved+"개";$("category").textContent="CASE "+String(solved+1).padStart(2,"0")+" · "+current.category+" · "+current.difficulty;$("title").textContent=current.title;$("question").textContent=current.question;showCaseImage(current);preloadNextCase();$("feedback").textContent="";$("next").hidden=true;renderClue();renderOptions();tick();tickId=setInterval(tick,200)}
function renderOptions(){$("options").replaceChildren();shuffle(current.options).forEach((opt,i)=>{const b=document.createElement("button");b.textContent=String.fromCharCode(65+i)+". "+opt;b.onclick=()=>answer(opt,b);$("options").append(b)})}
function renderClue(){const remaining=Math.max(0,MAX_CLUES-hintsUsed);$("clueRemain").textContent=remaining+" / "+MAX_CLUES;$("clueBtn").disabled=revealed>0||remaining<=0||phase!=="playing";$("clueBtn").textContent=revealed?"단서 사용 완료":remaining<=0?"단서 모두 사용":"단서 보기";$("clueReveal").hidden=!revealed;$("clueReveal").textContent=revealed?(current.hints?.[0]||"추리 방향을 다시 살펴보세요."):""}
$("clueBtn").onclick=()=>{if(!checkDay())return;if(phase!=="playing"||revealed||hintsUsed>=MAX_CLUES||Date.now()>=deadline)return;revealed=1;hintsUsed++;renderClue()}
function tick(){if(!checkDay())return;if(phase!=="playing"&&phase!=="solved")return;const left=Math.max(0,Math.ceil((deadline-Date.now())/1000)),t=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");$("timer").textContent=t;$("timerRing").style.setProperty("--pct",(left/300*100)+"%");if(!left)finish("시간 초과",phase==="playing")}
function answer(opt,b){if(!checkDay())return;if(phase!=="playing")return;if(Date.now()>=deadline){finish("시간 초과",true);return}if(opt!==current.answer){wrong++;b.disabled=true;b.classList.add("wrong");$("feedback").textContent="오답입니다. 남은 시간 안에 다시 추리하세요.";return}phase="solved";solved++;score=solved*100;saveBest();$("score").textContent=score.toLocaleString()+"점";$("scoreMirror").textContent=score.toLocaleString()+"점";$("solvedText").textContent="정답 "+solved+"개";$("feedback").textContent="정답! "+current.explanation;[...$("options").children].forEach(x=>x.disabled=true);renderClue();$("next").hidden=false;$("next").textContent=deck.length?"다음 사건 →":"결과 보기";updateBestUI();if(!deck.length)finish("모든 사건 해결",false)}
async function finish(title,reveal){if(!checkDay())return;if(phase==="finished")return;clearInterval(tickId);phase="finished";saveBest();$("resultTitle").textContent=title;$("resultScore").textContent=score.toLocaleString()+"점";const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$("resultStats").innerHTML='<div class="statBox">정답 수<b>'+solved+'개</b></div><div class="statBox">단서 사용<b>'+hintsUsed+'회</b></div><div class="statBox">남은 시간<b>'+String(Math.floor(left/60)).padStart(2,"0")+':'+String(left%60).padStart(2,"0")+'</b></div>';$("resultExplanation").textContent=reveal&&current?"정답: "+current.answer+" — "+current.explanation:"";show("result");submitRanking().then(loadLeaderboard)}
[...new Set(BANK.map(x=>x.category))].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;$("categoryFilter").append(o)});
$("saveNick").onclick=saveNickname;$("start").onclick=()=>start();$("daily").onclick=()=>start("daily");$("categoryStart").onclick=()=>start("normal",$("categoryFilter").value);
$("openRanking").onclick=()=>{show("rankings");loadLeaderboard()};$("openRecord").onclick=()=>{show("records");loadLeaderboard()};$("rankingBack").onclick=home;$("recordBack").onclick=home;$("refreshRanking").onclick=loadLeaderboard;
$("next").onclick=()=>phase==="solved"&&load();$("quit").onclick=()=>finish("수사 종료",phase==="playing");$("again").onclick=()=>start();$("back").onclick=home;
document.addEventListener("visibilitychange",()=>{if(checkDay())tick()});setInterval(checkDay,1000);$("homeBankCount").textContent=String(BANK.length);home();
</script>
</body></html>
